<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How Aurenoeva works — Intelligent technical procurement</title><meta name="description" content="See how Aurenoeva combines proprietary procurement engines with managed sourcing from requirement and catalogue identity through evidence, compliance, transaction control, fulfilment and close."><link rel="stylesheet" href="assets/css/site.css?v=8.2.6.8"><meta name="theme-color" content="#0E3A33"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/brand/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/img/brand/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"></head><body><a class="skip" href="#main">Skip to content</a><header id="site-header" class="site-header"></header><main id="main"><section class="page-hero"><div class="wrap"><div class="eyebrow" data-en="Proprietary software + managed procurement" data-de="Intelligente Software und persönliche Unterstützung"></div><h1 data-en="The search is automated. The decision stays explainable." data-de="Wir erleichtern die Suche. Sie behalten den Überblick."></h1><p data-en="Aurenoeva combines proprietary discovery, resolution, evidence and decision engines with hands-on procurement. The software does the repetitive market work; the workflow keeps identity, proof, risk, supplier context and true cost visible until you are ready to decide." data-de="Unsere Software findet und vergleicht mögliche Bezugsquellen. Gleichzeitig begleiten wir die technische und kaufmännische Prüfung. So sehen Sie, welche Produkte passen, welche Angaben belegt sind und welche Kosten und Risiken berücksichtigt werden müssen."></p></div></section><section class="section"><div class="wrap content-grid"><aside class="toc"><a href="#process" data-en="The journey" data-de="Der Ablauf"></a><a href="#engines" data-en="Engine layer" data-de="Unsere Software"></a><a href="#decision" data-en="Decision model" data-de="Angebote vergleichen"></a><a href="#clearance" data-en="Compliance & clearance" data-de="Compliance & Freigabe"></a><a href="#completion" data-en="Transaction & fulfilment" data-de="Transaktion & Abwicklung"></a><a href="#roles" data-en="Who does what" data-de="Rollen"></a><a href="#transaction" data-en="Commercial boundary" data-de="Kaufmännische Bedingungen"></a></aside><div class="prose"><h2 id="process" data-en="From a rough need to a qualified acquisition" data-de="Von der ersten Anfrage bis zur passenden Lösung"></h2><p data-en="The customer journey is deliberately short. The technical work expands only where it changes the answer. That keeps the interface simple without simplifying away the things that make difficult procurement difficult." data-de="Der Einstieg ist unkompliziert. Technische Details fragen wir nur dann ab, wenn sie für die Suche oder Bewertung wichtig sind."></p><div class="process-list"><div class="process-item"><div class="num">01</div><div><h3 data-en="Understand the requirement" data-de="Anforderungen verstehen"></h3><p data-en="Start with what the buyer knows: a part number, an application, an existing machine, a failure situation or a plain-language brief. We structure the requirement and leave real unknowns visible." data-de="Sie teilen uns mit, was Sie wissen: Teilenummer, Einsatzgebiet, vorhandenes Gerät oder eine kurze Problembeschreibung. Wir machen daraus eine klare Anfrage und halten fest, was noch zu klären ist."></p></div><span class="tag">Requirement Lens</span></div><div class="process-item"><div class="num">02</div><div><h3 data-en="Discover plausible supply" data-de="Mögliche Lieferanten finden"></h3><p data-en="Our discovery and watch layer searches relevant manufacturer information, specialist suppliers, known inventory and approved sources, then brings possible matches into one working set." data-de="Wir recherchieren bei Herstellern, spezialisierten Anbietern und weiteren relevanten Quellen. Geeignete Treffer führen wir für die weitere Prüfung zusammen."></p></div><span class="tag">Discovery &amp; Watch</span></div><div class="process-item"><div class="num">03</div><div><h3 data-en="Resolve the exact identity" data-de="Das richtige Teil bestimmen"></h3><p data-en="Manufacturer, model, part number, option codes, serial information, lifecycle status and replacement relationships are reconciled before unlike items are compared as if they were the same." data-de="Wir gleichen Hersteller, Modell, Teilenummer und Ausführung ab. So vermeiden wir, dass unterschiedliche Produkte irrtümlich als gleichwertig gelten."></p></div><span class="tag">Identity Resolution</span></div><div class="process-item"><div class="num">04</div><div><h3 data-en="Build the evidence picture" data-de="Unterlagen und Nachweise zusammentragen"></h3><p data-en="Documents, photos, service history, calibration or qualification records and supplier statements stay connected to the candidate they describe. Claims and proof are not treated as the same thing." data-de="Dokumente, Fotos, Wartungsunterlagen und Prüfnachweise werden dem jeweiligen Angebot zugeordnet. Lieferantenangaben kennzeichnen wir als solche, solange sie nicht belegt sind."></p></div><span class="tag">Evidence Passport</span></div><div class="process-item"><div class="num">05</div><div><h3 data-en="Make risk visible" data-de="Risiken verständlich darstellen"></h3><p data-en="Technical, evidence, supplier, fulfilment and commercial risks are kept separate. That makes it clear whether a concern is about the product itself, the proof behind it, the counterparty or the route to delivery." data-de="Wir unterscheiden zwischen technischen Risiken, fehlenden Nachweisen, Lieferantenrisiken und Fragen rund um Lieferung oder Kosten. So erkennen Sie, wo noch Klärungsbedarf besteht."></p></div><span class="tag" data-en="Risk model" data-de="Risikobewertung"></span></div><div class="process-item"><div class="num">06</div><div><h3 data-en="Compare the real economics" data-de="Gesamtkosten vergleichen"></h3><p data-en="The visible asking price is only one component. Where relevant, we reconcile freight, inspection, remediation, calibration or qualification, taxes and other acquisition adjustments into a comparable cost picture." data-de="Zum Angebotspreis können Transport, Prüfung, Aufbereitung, Kalibrierung, Steuern oder andere Kosten hinzukommen. Soweit die Angaben vorliegen, berücksichtigen wir sie im Vergleich."></p></div><span class="tag">Acquisition Instrument</span></div><div class="process-item"><div class="num">07</div><div><h3 data-en="Choose with the conditions visible" data-de="Mit klaren Bedingungen entscheiden"></h3><p data-en="Qualified options are presented with the evidence, open questions and conditions that matter. The aim is not to hide complexity in a score, but to make the trade-offs easy to understand." data-de="Sie sehen geeignete Optionen samt Nachweisen, offenen Fragen und Bedingungen. Eine Empfehlung soll nachvollziehbar sein – nicht nur auf einer undurchsichtigen Kennzahl beruhen."></p></div><span class="tag">Decision Field</span></div><div class="process-item"><div class="num">08</div><div><h3 data-en="Clear the transaction conditions" data-de="Rechtliche und vertragliche Bedingungen klären"></h3><p data-en="Where relevant, product, party, country, end-use and documentary requirements are checked against the transaction context. Open or conditional points remain visible instead of being treated as automatically cleared." data-de="Je nach Produkt, Lieferland und Verwendungszweck prüfen wir die einschlägigen Vorgaben und erforderlichen Unterlagen. Offene Fragen gelten dabei nicht automatisch als geklärt."></p></div><span class="tag" data-en="Compliance & applicability" data-de="Vorgaben und Prüfpflichten"></span></div><div class="process-item"><div class="num">09</div><div><h3 data-en="Agree the commercial structure" data-de="Kaufmännische Bedingungen abstimmen"></h3><p data-en="The seller, buyer, Aurenoeva and any specialist parties remain explicitly identified. Transaction documents, responsibilities, funding conditions and release requirements are tied to the same acquisition." data-de="Wir halten fest, wer Käufer und Verkäufer ist, welche Aufgaben Aurenoeva übernimmt und welche Vertrags- und Zahlungsbedingungen gelten."></p></div><span class="tag" data-en="Transaction & role control" data-de="Abwicklung und Zuständigkeiten"></span></div><div class="process-item"><div class="num">10</div><div><h3 data-en="Fulfil, accept and close" data-de="Lieferung und Abschluss begleiten"></h3><p data-en="Inspection or release, dispatch, delivery, acceptance, exceptions and settlement evidence remain connected. The acquisition closes with an auditable record rather than disappearing after the supplier is chosen." data-de="Prüfung, Versand, Lieferung, Abnahme und erforderliche Zahlungsnachweise werden dem Vorgang zugeordnet und dokumentiert."></p></div><span class="tag" data-en="Fulfilment & close" data-de="Abwicklung & Abschluss"></span></div><div class="process-item"><div class="num">11</div><div><h3 data-en="Keep the acquisition record" data-de="Unterlagen dauerhaft zusammenhalten"></h3><p data-en="The selected product, supplier, documents, commercial terms, logistics and issue history remain connected for future support, repeat sourcing and learning." data-de="Produktdaten, Lieferanteninformationen, Dokumente und Konditionen bleiben für spätere Rückfragen oder eine erneute Beschaffung zusammen verfügbar."></p></div><span class="tag" data-en="Acquisition record" data-de="Beschaffungsakte"></span></div></div><h2 id="engines" data-en="The software layer behind the simple interface" data-de="Was unsere Software im Hintergrund leistet"></h2><p data-en="Aurenoeva is not a manual search service wrapped in a form. Its proprietary engines are designed to do the repeatable work across markets: interpreting requirements, discovering and watching sources, extracting and normalising data, resolving identity, preserving evidence and detecting change. Human procurement work is then concentrated where judgement, supplier dialogue and commercial context actually matter." data-de="Hinter der einfachen Eingabe arbeitet eine Software, die Produktinformationen auswertet, neue Quellen findet, Teilenummern abgleicht und Änderungen erkennt. Unsere Fachleute kümmern sich um die Fragen, die Erfahrung, Urteilsvermögen und den direkten Austausch mit Lieferanten erfordern."></p><div class="cards-4"><article class="card"><div class="ref">ENGINE 01</div><h3 data-en="Requirement intelligence" data-de="Anfragen verstehen"></h3><p data-en="Understands identifiers, applications, constraints and missing information, then turns them into a structured search problem." data-de="Erfasst Teilenummern, Einsatzgebiete und technische Anforderungen und erkennt fehlende Angaben."></p></article><article class="card"><div class="ref">ENGINE 02</div><h3 data-en="Discovery & watch" data-de="Discovery &amp; Watch"></h3><p data-en="Finds relevant sources and revisits them so new supply, changed availability and material updates can be detected." data-de="Findet mögliche Bezugsquellen und prüft regelmäßig, ob neue Produktinformationen oder Angebote vorliegen."></p></article><article class="card"><div class="ref">ENGINE 03</div><h3 data-en="Evidence & resolution" data-de="Nachweise &amp; Auflösung"></h3><p data-en="Normalises product and supplier identity, connects claims to source evidence and keeps gaps or contradictions visible." data-de="Gleicht Produkt- und Lieferantenangaben ab und macht fehlende oder widersprüchliche Informationen sichtbar."></p></article><article class="card"><div class="ref">ENGINE 04</div><h3 data-en="Acquisition intelligence" data-de="Angebote bewerten"></h3><p data-en="Combines technical fit, evidence, risk and true cost into a comparable decision context without collapsing them into one opaque score." data-de="Stellt technische Eignung, Nachweise, Risiken und Gesamtkosten übersichtlich gegenüber."></p></article></div><h2 id="decision" data-en="A recommendation you can question" data-de="Eine Empfehlung, die Sie nachvollziehen können"></h2><p data-en="Technical fit, evidence strength, risk and acquisition cost remain separately inspectable. Aurenoeva can recommend a route, but the reasoning, conditions and remaining uncertainty stay visible. That is what makes the recommendation useful for a real procurement decision rather than just another ranking." data-de="Wir zeigen, worauf eine Empfehlung beruht: technische Eignung, verfügbare Nachweise, Risiken und Kosten. So können Sie die vorgeschlagene Bezugsquelle selbst beurteilen."></p><h2 id="clearance" data-en="Compliance is a stage, not a hidden assumption" data-de="Rechtliche Prüfungen sind ein eigener Schritt"></h2><p data-en="Once a credible acquisition route exists, Aurenoeva can bring the relevant transaction context into the shared NOEVA compliance layer. Depending on the case, this can include the product, parties, countries, end use, documentation, certifications and other transaction-specific conditions. The result is not reduced to a marketing badge: conditions, review requirements and unresolved points remain explicit before contracting, funding or dispatch." data-de="Je nach Produkt, Lieferland und Verwendungszweck können weitere Prüfungen erforderlich sein. Wir halten fest, welche Unterlagen vorliegen, welche Vorgaben gelten und was vor Vertragsschluss, Zahlung oder Versand noch zu klären ist."></p><div class="clearance-states"><span data-en="Clear" data-de="Freigegeben"></span><span data-en="Clear with conditions" data-de="Mit Bedingungen"></span><span data-en="Review required" data-de="Prüfung erforderlich"></span><span data-en="Hold" data-de="Zurückgestellt"></span></div><p class="muted-note" data-en="The exact checks depend on the product and transaction. Aurenoeva does not imply that every enquiry requires the same regulatory analysis." data-de="Welche Prüfungen erforderlich sind, hängt vom Produkt und vom konkreten Vorgang ab. Aurenoeva unterstellt nicht, dass jede Anfrage dieselbe regulatorische Prüfung benötigt."></p><h2 id="completion" data-en="After the decision: assemble, agree, fund, fulfil, close" data-de="Nach der Auswahl: Bedingungen klären und die Beschaffung abwickeln"></h2><p data-en="Finding a supplier is not treated as the end of the job. The selected item, supplier, evidence and transaction context can continue through a controlled commercial path." data-de="Mit der Lieferantenauswahl beginnt die eigentliche Abwicklung. Produkt, Unterlagen und vereinbarte Bedingungen bleiben dabei dem Vorgang zugeordnet."></p><div class="completion-flow"><article><span>01</span><b data-en="ASSEMBLE" data-de="ZUSAMMENFÜHREN"></b><p data-en="Product identity, supplier, parties, evidence, price and transaction facts are brought into one record." data-de="Produktidentität, Lieferant, Parteien, Nachweise, Preis und Transaktionsdaten werden in einer Akte zusammengeführt."></p></article><article><span>02</span><b data-en="AGREE" data-de="VEREINBAREN"></b><p data-en="Roles, conditions and the applicable transaction documents are made explicit before commitment." data-de="Rollen, Bedingungen und die anwendbaren Transaktionsdokumente werden vor der Bindung eindeutig festgelegt."></p></article><article><span>03</span><b data-en="FUND" data-de="ZAHLUNG KLÄREN"></b><p data-en="Funding obligations, release conditions and expected monetary movements remain tied to the transaction." data-de="Zahlungsbedingungen und erforderliche Freigaben werden mit dem Vorgang dokumentiert."></p></article><article><span>04</span><b data-en="FULFIL" data-de="ABWICKELN"></b><p data-en="Inspection or release, dispatch, delivery, acceptance and exceptions are recorded against the same acquisition." data-de="Prüfung oder Freigabe, Versand, Lieferung, Abnahme und Ausnahmen werden derselben Beschaffung zugeordnet."></p></article><article><span>05</span><b data-en="CLOSE" data-de="ABSCHLIESSEN"></b><p data-en="Settlement and evidence are reconciled and the acquisition becomes a durable record." data-de="Zahlungs- und Nachweisdaten werden abgeglichen und die Beschaffung wird als dauerhafte Akte abgeschlossen."></p></article></div><div class="role-boundary"><strong data-en="Roles stay explicit." data-de="Zuständigkeiten bleiben klar."></strong><span data-en="Aurenoeva is the procurement and brokerage orchestrator. It does not silently become the seller, title holder, inventory holder, importer/exporter, warranty provider or holder of seller funds. The actual roles are defined for the specific transaction." data-de="Aurenoeva unterstützt die Beschaffung und koordiniert den Prozess. Wir werden dadurch nicht automatisch Verkäufer, Eigentümer, Lagerhalter, Importeur, Exporteur oder Garantiegeber. Die jeweiligen Zuständigkeiten werden für jeden Vorgang ausdrücklich vereinbart."></span></div><h2 id="roles" data-en="Who does what" data-de="Wer ist wofür zuständig?"></h2><table class="matrix"><thead><tr><th data-en="Role" data-de="Rolle"></th><th data-en="Responsibility" data-de="Aufgabe"></th></tr></thead><tbody><tr><td data-en="Buyer" data-de="Kunde"></td><td data-en="Explains the operational need, reviews qualified options and approves the acquisition route." data-de="Beschreibt die Anforderungen, prüft geeignete Angebote und trifft die Kaufentscheidung."></td></tr><tr><td>Aurenoeva</td><td data-en="Structures the requirement, runs the sourcing and evidence workflow, compares credible candidates and manages supplier engagement." data-de="Klärt Anforderungen, recherchiert Bezugsquellen, prüft Nachweise, vergleicht Angebote und stimmt sich mit Lieferanten ab."></td></tr><tr><td data-en="Supplier" data-de="Lieferant"></td><td data-en="Provides the product or asset, commercial terms and supporting evidence, then fulfils the agreed supply obligation." data-de="Bietet das Produkt an, stellt Unterlagen und Konditionen bereit und erfüllt die vereinbarten Lieferpflichten."></td></tr><tr><td>NOEVA CORE OS</td><td data-en="Provides shared discovery, crawling, extraction, evidence, workflow, CRM and compliance capabilities used by Aurenoeva." data-de="Stellt gemeinsame Discovery-, Crawling-, Extraktions-, Nachweis-, Workflow-, CRM- und Compliance-Funktionen bereit, die Aurenoeva nutzt."></td></tr></tbody></table><h2 id="transaction" data-en="The commercial boundary" data-de="Die kaufmännischen Bedingungen"></h2><p data-en="The public website starts the procurement journey; it is not an anonymous marketplace checkout. The commercial structure can vary with the asset, supplier, jurisdiction and risk. Seller-of-record, payment, delivery, acceptance and warranty terms are therefore defined in the documentation for the specific transaction." data-de="Über die Website starten Sie eine Anfrage, keine verbindliche Bestellung. Wer verkauft, wie bezahlt wird und welche Liefer-, Abnahme- und Gewährleistungsbedingungen gelten, wird im jeweiligen Geschäft ausdrücklich vereinbart."></p></div></div></section></main><footer id="site-footer" class="site-footer"></footer><script src="assets/js/site.js?v=8.2.6.8"></script></body></html>
