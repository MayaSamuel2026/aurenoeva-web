<title>About Aurenoeva — Technical procurement for difficult requirements</title>

<style>
:root{
  --about-ink:#0E3A33;
  --about-deep:#082D28;
  --about-forest:#3F6F62;
  --about-sage:#E9F1ED;
  --about-cream:#F8F7F3;
  --about-paper:#fff;
  --about-sand:#C9B896;
  --about-line:#D7E0DC;
  --about-muted:#5E716B;
}
.about-main{background:var(--about-cream);color:var(--about-ink)}
.about-wrap{width:min(1240px,calc(100% - 44px));margin:auto}
.about-eyebrow{font-size:10px;line-height:1.2;font-weight:850;letter-spacing:.17em;text-transform:uppercase;color:var(--about-forest)}
.about-eyebrow:after{content:"";display:inline-block;width:30px;height:1px;background:var(--about-sand);margin-left:11px;vertical-align:middle}
.about-hero{
  position:relative;overflow:hidden;padding:76px 0 70px;border-bottom:1px solid var(--about-line);
  background:
    radial-gradient(circle at 84% 18%,rgba(201,184,150,.18),transparent 25%),
    radial-gradient(circle at 66% 86%,rgba(63,111,98,.07),transparent 31%),
    var(--about-cream);
}
.about-hero-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(440px,.82fr);gap:70px;align-items:center}
.about-hero h1{margin:15px 0 20px;max-width:710px;font-size:clamp(52px,5.5vw,78px);line-height:1.01;letter-spacing:-.046em;font-weight:720}
.about-hero .lead{max-width:690px;margin:0;font-size:17px;line-height:1.67;color:#536A63}
.about-hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}
.about-hero-note{display:flex;gap:22px;flex-wrap:wrap;margin-top:21px;color:#587069;font-size:10.5px}
.about-hero-note span:before{content:"✓";color:var(--about-forest);font-weight:900;margin-right:7px}

.about-map{
  position:relative;min-height:470px;border:1px solid rgba(14,58,51,.14);border-radius:30px;padding:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(247,250,248,.95));
  box-shadow:0 28px 78px rgba(14,58,51,.10);
}
.about-map-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:5px 4px 18px}
.about-map-head strong{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.about-map-head span{max-width:215px;text-align:right;font-size:9.8px;line-height:1.45;color:#70817B}
.about-flow{position:relative;display:grid;gap:10px}
.about-flow:before{content:"";position:absolute;left:25px;top:33px;bottom:33px;width:1px;background:linear-gradient(var(--about-sand),rgba(63,111,98,.3))}
.about-flow-card{
  position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:13px;align-items:center;
  min-height:67px;padding:10px 11px;border:1px solid #DFE7E3;border-radius:15px;background:#fff;
}
.about-flow-no{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--about-sage);font-size:9px;font-weight:900}
.about-flow-card:nth-child(5) .about-flow-no{background:var(--about-ink);color:#fff}
.about-flow-card b{display:block;font-size:13px}
.about-flow-card small{display:block;margin-top:2px;font-size:9.5px;line-height:1.35;color:#71827C}
.about-flow-state{font-size:8px;font-weight:850;letter-spacing:.11em;color:var(--about-forest);text-transform:uppercase}
.about-map-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.about-map-foot div{border-radius:13px;padding:12px 13px;background:#F2F6F4}
.about-map-foot small{display:block;font-size:8px;letter-spacing:.12em;color:#74857F;text-transform:uppercase}
.about-map-foot b{display:block;margin-top:3px;font-size:11px;line-height:1.3}

.about-section{padding:82px 0}
.about-section.white{background:#fff}
.about-section.dark{background:var(--about-deep);color:#fff}
.about-section-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.72fr);gap:70px;align-items:end;margin-bottom:35px}
.about-section-head h2{max-width:780px;margin:12px 0 0;font-size:clamp(39px,4.2vw,60px);line-height:1.02;letter-spacing:-.04em;font-weight:700}
.about-section-head p{margin:0;font-size:14px;line-height:1.68;color:#5C716A}
.about-section.dark .about-section-head p{color:#C8D8D3}
.about-section.dark .about-eyebrow{color:#90C2B5}

.about-reason-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}
.about-reason-main,.about-reason-side article{border:1px solid var(--about-line);border-radius:23px;background:#fff}
.about-reason-main{padding:32px 34px;min-height:320px}
.about-reason-main h3{max-width:700px;margin:0 0 18px;font-size:29px;line-height:1.16;letter-spacing:-.028em}
.about-reason-main p{max-width:780px;margin:0;font-size:14px;line-height:1.75;color:#596F68}
.about-reason-main .pull{margin-top:28px;padding-top:21px;border-top:1px solid var(--about-line);font-size:17px;line-height:1.5;color:var(--about-ink)}
.about-reason-side{display:grid;gap:15px}
.about-reason-side article{padding:22px 23px}
.about-reason-side span{display:block;font-size:9px;font-weight:850;letter-spacing:.14em;color:var(--about-forest)}
.about-reason-side h4{margin:7px 0 6px;font-size:16px}
.about-reason-side p{margin:0;font-size:11.5px;line-height:1.55;color:#647770}

.about-model{display:grid;grid-template-columns:1fr 70px 1fr;align-items:stretch}
.about-model-card{border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:29px;background:rgba(255,255,255,.045)}
.about-model-card .icon{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:20px;
  background:rgba(143,196,183,.12);border:1px solid rgba(143,196,183,.18)
}
.about-model-card svg{width:26px;height:26px;stroke:#A4CEC4;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.about-model-card h3{font-size:26px;line-height:1.14;margin:0 0 11px}
.about-model-card p{font-size:12.5px;line-height:1.7;color:#C9D8D3;margin:0}
.about-model-card ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.about-model-card li{font-size:10.5px;color:#DDE8E4}
.about-model-card li:before{content:"✓";margin-right:8px;color:#D7B66F;font-weight:900}
.about-model-plus{display:grid;place-items:center;font-size:30px;color:#D7B66F}

.about-cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.about-cap{
  position:relative;min-height:260px;border:1px solid var(--about-line);border-radius:22px;background:#fff;padding:25px 24px;
  box-shadow:0 11px 32px rgba(14,58,51,.045);
}
.about-cap .num{font-size:9px;font-weight:900;letter-spacing:.13em;color:var(--about-forest)}
.about-cap h3{margin:28px 0 10px;font-size:22px;line-height:1.17;letter-spacing:-.025em}
.about-cap p{margin:0;font-size:12px;line-height:1.65;color:#60736D}
.about-cap .cap-line{position:absolute;left:24px;right:24px;bottom:22px;height:1px;background:var(--about-line)}
.about-cap .cap-line:after{content:"";display:block;width:38%;height:1px;background:var(--about-sand)}

.about-not-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:34px;align-items:center}
.about-not-visual{
  min-height:330px;border:1px solid var(--about-line);border-radius:26px;background:
  radial-gradient(circle at 50% 38%,rgba(63,111,98,.13),transparent 28%),#F7FAF8;
  display:grid;place-items:center;padding:28px
}
.about-ring{position:relative;width:255px;height:255px;border-radius:50%;border:1px solid rgba(63,111,98,.22);display:grid;place-items:center}
.about-ring:before,.about-ring:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(63,111,98,.16)}
.about-ring:before{width:185px;height:185px}.about-ring:after{width:115px;height:115px}
.about-ring strong{position:relative;z-index:2;width:130px;text-align:center;font-size:14px;line-height:1.3}
.about-not-copy h2{font-size:45px;line-height:1.03;letter-spacing:-.04em;margin:12px 0 17px}
.about-not-copy>p{margin:0 0 25px;font-size:14px;line-height:1.7;color:#5D716A}
.about-not-list{display:grid;gap:10px}
.about-not-list div{display:grid;grid-template-columns:25px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--about-line)}
.about-not-list div:last-child{border-bottom:1px solid var(--about-line)}
.about-not-list b{font-size:13px}
.about-not-list span{font-size:11px;line-height:1.45;color:#647871}
.about-x{font-size:14px;color:#9E7C54;font-weight:900}

.about-core{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.about-core-copy,.about-core-map{border-radius:23px}
.about-core-copy{padding:31px;background:#fff;border:1px solid var(--about-line)}
.about-core-copy h3{margin:0 0 12px;font-size:27px;line-height:1.18}
.about-core-copy p{margin:0;font-size:12.5px;line-height:1.7;color:#5C716A}
.about-core-map{padding:25px;background:var(--about-ink);color:#fff}
.about-core-map>small{font-size:8.5px;letter-spacing:.13em;color:#9FC8BE;text-transform:uppercase}
.core-node{margin-top:17px;border:1px solid rgba(255,255,255,.17);border-radius:14px;padding:13px 14px;background:rgba(255,255,255,.04)}
.core-node b{display:block;font-size:12px}
.core-node span{font-size:9px;color:#BDD1CB}
.core-branches{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.core-branches div{border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:10px;font-size:9.5px;color:#D5E2DE}

.about-contact{padding:84px 0;background:linear-gradient(180deg,#F5F8F6,#fff)}
.about-contact-head{display:grid;grid-template-columns:1fr .72fr;gap:60px;align-items:end;margin-bottom:28px}
.about-contact-head h2{font-size:clamp(39px,4vw,58px);line-height:1.03;letter-spacing:-.04em;margin:12px 0 0}
.about-contact-head p{margin:0;font-size:13.5px;line-height:1.65;color:#5D716A}
.about-contact-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:16px}
.about-contact-side{display:grid;gap:14px}
.about-direct,.about-procurement-route,.about-contact-form{border:1px solid var(--about-line);border-radius:22px;background:#fff}
.about-direct,.about-procurement-route{padding:23px}
.about-direct h3,.about-procurement-route h3{font-size:20px;line-height:1.2;margin:6px 0 8px}
.about-direct p,.about-procurement-route p{font-size:11.5px;line-height:1.6;color:#60736D;margin:0 0 15px}
.about-email{display:inline-block;font-size:16px;font-weight:800;color:var(--about-forest);border-bottom:1px solid #9EC2B7}
.about-contact-form{padding:24px 25px}
.about-contact-form h3{margin:0 0 5px;font-size:23px}
.about-contact-form .intro{margin:0 0 19px;font-size:11.5px;line-height:1.55;color:#667A73}
.about-contact-form .form-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.about-contact-form .field{margin-bottom:10px}
.about-contact-form .field label{display:block;margin-bottom:5px;font-size:9.5px;font-weight:750;color:#526961}
.about-contact-form input,.about-contact-form select,.about-contact-form textarea{
  width:100%;border:1px solid #CBD8D3;border-radius:11px;background:#fff;color:var(--about-ink);padding:11px 12px;outline:0;
}
.about-contact-form textarea{min-height:132px;resize:vertical}
.about-contact-form input:focus,.about-contact-form select:focus,.about-contact-form textarea:focus{border-color:#6C9B8E;box-shadow:0 0 0 3px rgba(63,111,98,.08)}
.about-contact-form .privacy-check{display:flex;gap:9px;align-items:flex-start;margin:5px 0 15px;font-size:10px;line-height:1.45;color:#657871}
.about-contact-form .privacy-check input{width:auto;margin-top:3px}
.about-contact-form .hp-field{position:absolute;left:-9999px;opacity:0}
.about-contact-form .optional{font-weight:400;color:#82908B}
.about-contact-form .form-status{margin-bottom:13px;border-radius:10px;padding:10px 12px;font-size:11px}
.about-contact-form .form-status.success{background:#EAF3EF;color:#2E6557}
.about-contact-form .form-status.error{background:#F7EDE7;color:#815946}

@media(max-width:1040px){
  .about-hero-grid{grid-template-columns:1fr;gap:42px}
  .about-map{min-height:auto}
  .about-section-head,.about-contact-head{grid-template-columns:1fr;gap:18px}
  .about-reason-grid,.about-not-grid,.about-core,.about-contact-grid{grid-template-columns:1fr}
  .about-cap-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .about-wrap{width:min(100% - 28px,1240px)}
  .about-hero{padding:48px 0}
  .about-hero h1{font-size:47px}
  .about-map{padding:16px;border-radius:23px}
  .about-map-head{display:grid}
  .about-map-head span{text-align:left;max-width:none}
  .about-flow-card{grid-template-columns:45px 1fr}.about-flow-state{display:none}
  .about-section{padding:58px 0}
  .about-reason-main{padding:25px}
  .about-model{grid-template-columns:1fr;gap:10px}
  .about-model-plus{height:34px}
  .about-cap-grid{grid-template-columns:1fr}
  .about-contact-form .form-two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>

<main id="main" class="about-main">
<section class="about-hero">
  <div class="about-wrap about-hero-grid">
    <div>
      <div class="about-eyebrow" data-en="About Aurenoeva" data-de="Über Aurenoeva"></div>
      <h1 data-en="Procurement gets interesting when the easy answers run out." data-de="Schwierig zu beschaffen? Genau dafür gibt es Aurenoeva."></h1>
      <p class="lead" data-en="Aurenoeva is built for technical requirements that do not resolve cleanly through a catalogue search: scarce parts, obsolete components, specialist equipment, uncertain identities, second-life assets and purchases where the evidence matters as much as the price." data-de="Manche Ersatzteile sind kaum noch erhältlich. Bei anderen fehlen eindeutige Teilenummern, technische Unterlagen oder verlässliche Lieferantenangaben. Aurenoeva unterstützt Unternehmen bei genau diesen anspruchsvollen Beschaffungsaufgaben – von Einzelteilen bis zu Spezialgeräten und gebrauchten Anlagen."></p>
      <div class="about-hero-actions">
        <a class="btn large" href="requirement.html" data-en="Start a requirement →" data-de="Beschaffungsanfrage starten →"></a>
        <a class="btn ghost large" href="#contact" data-en="Talk to Aurenoeva" data-de="Aurenoeva kontaktieren"></a>
      </div>
      <div class="about-hero-note">
        <span data-en="Software-assisted" data-de="Softwaregestützt"></span>
        <span data-en="Human procurement" data-de="Persönliche Betreuung"></span>
        <span data-en="Evidence kept visible" data-de="Nachweise bleiben sichtbar"></span>
      </div>
    </div>

    <div class="about-map" aria-label="Aurenoeva procurement model">
      <div class="about-map-head">
        <strong data-en="From requirement to decision" data-de="Vom Bedarf zur Entscheidung"></strong>
        <span data-en="The work between 'we need this' and 'this is a credible acquisition route'." data-de="Wir machen aus einer ersten Anfrage eine nachvollziehbare Beschaffungsentscheidung."></span>
      </div>
      <div class="about-flow">
        <div class="about-flow-card"><span class="about-flow-no">01</span><div><b data-en="Clarify the requirement" data-de="Bedarf klären"></b><small data-en="Identifiers, configuration, application, geography and constraints." data-de="Teilenummern, technische Anforderungen, Einsatzbereich und Lieferbedingungen."></small></div><span class="about-flow-state" data-en="Structure" data-de="Struktur"></span></div>
        <div class="about-flow-card"><span class="about-flow-no">02</span><div><b data-en="Resolve what the item actually is" data-de="Das richtige Produkt bestimmen"></b><small data-en="Exact identity, compatibility, supersession and lifecycle context." data-de="Teilenummer, Ausführung, Kompatibilität und mögliche Nachfolgemodelle."></small></div><span class="about-flow-state" data-en="Resolve" data-de="Abgleichen"></span></div>
        <div class="about-flow-card"><span class="about-flow-no">03</span><div><b data-en="Discover credible supply" data-de="Geeignete Bezugsquellen finden"></b><small data-en="Manufacturers, specialist suppliers and changing availability." data-de="Hersteller, Fachhändler und weitere mögliche Lieferanten."></small></div><span class="about-flow-state" data-en="Discover" data-de="Finden"></span></div>
        <div class="about-flow-card"><span class="about-flow-no">04</span><div><b data-en="Verify the evidence" data-de="Nachweise prüfen"></b><small data-en="Condition, provenance, documentation, supplier credibility and open questions." data-de="Zustand, Herkunft, Unterlagen und noch offene Fragen."></small></div><span class="about-flow-state" data-en="Evidence" data-de="Nachweise"></span></div>
        <div class="about-flow-card"><span class="about-flow-no">05</span><div><b data-en="Build the acquisition decision" data-de="Angebote fundiert vergleichen"></b><small data-en="Fit, risk, economics and the reasoning behind the preferred route." data-de="Technische Eignung, Risiken und Gesamtkosten im Vergleich."></small></div><span class="about-flow-state" data-en="Decision" data-de="Entscheidung"></span></div>
      </div>
      <div class="about-map-foot">
        <div><small data-en="Customer sees" data-de="Sie erhalten"></small><b data-en="A clearer decision, not another search result." data-de="Eine fundierte Entscheidungsgrundlage statt einer bloßen Trefferliste."></b></div>
        <div><small data-en="Aurenoeva preserves" data-de="Wir dokumentieren"></small><b data-en="The evidence trail and unresolved questions." data-de="Vorliegende Nachweise und noch offene Fragen."></b></div>
      </div>
    </div>
  </div>
</section>

<section class="about-section white">
  <div class="about-wrap">
    <div class="about-section-head">
      <div><div class="about-eyebrow" data-en="Why we exist" data-de="Warum es uns gibt"></div><h2 data-en="The difficult part of procurement is rarely finding one listing." data-de="Ein Angebot zu finden, ist oft nicht das größte Problem."></h2></div>
      <p data-en="The harder work is deciding whether the listing describes the right item, whether the supplier can support the claim, whether the condition is acceptable and whether the total acquisition route is credible." data-de="Entscheidend ist, ob das angebotene Teil wirklich passt, der Zustand den Anforderungen entspricht und der Lieferant seine Angaben belegen kann."></p>
    </div>
    <div class="about-reason-grid">
      <article class="about-reason-main">
        <h3 data-en="Aurenoeva sits in the gap between search and commitment." data-de="Wir unterstützen Sie auf dem Weg von der Produktsuche zur sicheren Kaufentscheidung."></h3>
        <p data-en="In straightforward procurement, manufacturer, part number, specification, availability and price often line up cleanly. In difficult procurement they do not. A model can have several revisions. A part number can be incomplete. A supplier may have stock without enough evidence. A cheaper option may become the expensive one after inspection, freight, duties or rework. Our job is to make those differences visible before a buyer commits." data-de="Nicht jede Teilenummer bezeichnet automatisch die richtige Ausführung. Nicht jeder Lagerbestand ist ausreichend dokumentiert. Und das günstigste Angebot kann durch Prüfung, Transport, Zoll oder Nacharbeit teurer werden. Wir helfen Ihnen, solche Unterschiede frühzeitig zu erkennen."></p>
        <div class="pull" data-en="We are not trying to make every technical purchase look simple. We are trying to make difficult purchases understandable." data-de="Wir versprechen keine einfachen Antworten, wo es keine gibt. Wir machen komplexe Beschaffung nachvollziehbar."></div>
      </article>
      <div class="about-reason-side">
        <article><span>01 · IDENTITY</span><h4 data-en="Is it actually the right item?" data-de="Ist es wirklich der richtige Artikel?"></h4><p data-en="Identity, revision, compatibility, supersession and configuration can matter more than the headline description." data-de="Ausführung, Versionsstand und Kompatibilität sind oft wichtiger als die Bezeichnung im Angebot."></p></article>
        <article><span>02 · EVIDENCE</span><h4 data-en="What can be proven?" data-de="Was lässt sich belegen?"></h4><p data-en="Claims remain separate from manufacturer evidence, supplier documents, condition evidence and unresolved questions." data-de="Wir unterscheiden klar zwischen Angaben eines Lieferanten und tatsächlich vorliegenden Nachweisen."></p></article>
        <article><span>03 · ECONOMICS</span><h4 data-en="What does acquisition really cost?" data-de="Wie hoch sind die tatsächlichen Gesamtkosten?"></h4><p data-en="The cheapest quote is not necessarily the lowest-risk or lowest-total-cost acquisition route." data-de="Das günstigste Angebot ist nicht automatisch der risikoärmste oder insgesamt wirtschaftlichste Beschaffungsweg."></p></article>
      </div>
    </div>
  </div>
</section>

<section class="about-section dark">
  <div class="about-wrap">
    <div class="about-section-head">
      <div><div class="about-eyebrow" data-en="The operating model" data-de="Das Arbeitsmodell"></div><h2 data-en="Software does the machine work. People do the procurement work." data-de="Die Software übernimmt die Suche. Wir kümmern uns um die Beschaffung."></h2></div>
      <p data-en="Aurenoeva is deliberately neither a pure software tool nor a traditional manual sourcing desk. The advantage comes from combining both." data-de="Aurenoeva verbindet digitale Recherche und Datenanalyse mit der Erfahrung im technischen Einkauf. So lassen sich auch schwierige Anfragen effizient bearbeiten."></p>
    </div>
