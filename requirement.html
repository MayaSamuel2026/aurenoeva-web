<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start a procurement requirement — Aurenoeva</title><meta name="description" content="Start an Aurenoeva procurement requirement with a part number, category, application or plain-language brief."><link rel="stylesheet" href="assets/css/site.css?v=8.2.6.8"><meta name="theme-color" content="#0E3A33"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/brand/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/img/brand/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"><link rel="stylesheet" href="assets/css/catalogue-browser.css?v=d2451bdfbbc2"></head><body><a class="skip" href="#main">Skip to content</a><header id="site-header" class="site-header"></header><main id="main"><section class="page-hero"><div class="wrap"><div class="eyebrow" data-en="Procurement start / four short steps" data-de="Ihre Beschaffungsanfrage in vier Schritten"></div><h1 data-en="Tell us what you know. We’ll structure what is missing." data-de="Sagen Sie uns, was Sie benötigen. Wir helfen bei den Details."></h1><p data-en="Start with whatever you have. If our catalogue recognises the product, select the exact part — including more than one part if needed. Its canonical identity and part number then stay attached to your enquiry. If there is no match, continue with the identifier, application or description you have." data-de="Beginnen Sie mit einer Teilenummer, einem Modell oder einer kurzen Beschreibung. Finden Sie ein passendes Teil in unserem Katalog, können Sie es direkt auswählen – auch mehrere Teile. Gibt es keinen Treffer, können Sie Ihre Anfrage trotzdem problemlos fortsetzen."></p></div></section><section class="section"><div class="wrap form-shell"><div class="wizard" data-wizard><div class="wizard-head"><span class="eyebrow" data-step-label>01 / 04</span><div class="wizard-progress" aria-label="Progress"><i class="active"></i><i></i><i></i><i></i></div></div><div class="wizard-body"><div id="wizard-error" class="form-status error" role="alert" hidden></div><section class="wizard-step" data-wizard-step="1"><h2 style="font-family:var(--serif);font-weight:500;margin-top:0" data-en="What are you trying to source?" data-de="Was möchten Sie beschaffen?"></h2><div class="field"><label for="req-mode" data-en="What do you already know?" data-de="Welche Angaben liegen Ihnen vor?"></label><select id="req-mode"><option value="category" data-en="I know the category" data-de="Ich kenne die Kategorie"></option><option value="exact" data-en="I know the part or model" data-de="Ich kenne die Teilenummer oder das Modell"></option><option value="requirement" data-en="I know the application or desired outcome" data-de="Ich kann den Einsatz oder die Funktion beschreiben"></option></select></div><div class="field"><label for="req-industry" data-en="Technical sector" data-de="Technischer Bereich"></label><select id="req-industry"><option value="laboratory" data-en="Laboratory" data-de="Labor & Analytik"></option><option value="test" data-en="Test & Measurement" data-de="Mess- & Prüftechnik"></option><option value="medical" data-en="Medical" data-de="Medizintechnik"></option><option value="industrial" data-en="Industrial" data-de="Industrie & Automation"></option><option value="energy" data-en="Energy" data-de="Energie"></option><option value="marine">Marine</option><option value="aviation" data-en="Aviation" data-de="Luftfahrt"></option></select></div><div class="field"><label for="req-category" data-en="Product category" data-de="Produktkategorie"></label><select id="req-category"></select></div><div class="field"><label for="req-query"><span data-en="Known model, part number or manufacturer" data-de="Modell, Teilenummer oder Hersteller"></span> <span style="font-weight:400" data-en="(optional)" data-de="(optional)"></span></label><input id="req-query" type="text" data-placeholder-en="e.g. Agilent 1260 / 6ES7… / Tektronix MDO…" data-placeholder-de="z. B. Agilent 1260 / 6ES7… / Tektronix MDO…"></div><div class="catalogue-search-actions"><button class="btn ghost small" id="req-search-catalogue" type="button" data-en="Search catalogue →" data-de="Katalog durchsuchen →"></button><span data-en="A catalogue match is a candidate until identity and evidence are qualified." data-de="Ein Treffer bedeutet noch nicht, dass das Teil verfügbar ist oder technisch passt. Das klären wir im nächsten Schritt."></span></div><div class="catalogue-match-panel" id="req-match-panel" hidden><div class="catalogue-match-status neutral" id="req-match-status"></div><div id="req-matches" class="catalogue-matches"></div></div><div id="req-selected-parts" class="selected-parts-tray" hidden></div><div class="field"><label for="req-description" data-en="Describe what you need in your own words" data-de="Beschreiben Sie kurz, was Sie suchen"></label><textarea id="req-description" data-placeholder-en="Example: replacement unit for an existing line; must work with the current controller and arrive in Germany within three weeks." data-placeholder-de="Beispiel: Ersatzgerät für eine bestehende Linie; muss mit der vorhandenen Steuerung funktionieren und innerhalb von drei Wochen in Deutschland eintreffen."></textarea></div><div class="wizard-actions"><span></span><button class="btn" type="button" data-next data-en="Continue →" data-de="Weiter →"></button></div></section><section class="wizard-step" data-wizard-step="2" hidden><h2 style="font-family:var(--serif);font-weight:500;margin-top:0" data-en="Now add only the constraints that can change the search." data-de="Ergänzen Sie nur die Angaben, die für Ihre Anfrage wichtig sind."></h2><div class="field"><label for="req-condition" data-en="Condition" data-de="Zustand"></label><select id="req-condition"><option value="any" data-en="Any condition" data-de="Zustand egal"></option><option value="new" data-en="New only" data-de="Nur neu"></option><option value="refurbished" data-en="Refurbished accepted" data-de="Generalüberholt ist möglich"></option><option value="used" data-en="Used accepted" data-de="Gebraucht ist möglich"></option></select></div><div class="field"><label for="req-quantity" data-en="Quantity" data-de="Menge"></label><input id="req-quantity" type="text" data-placeholder-en="e.g. 2 units / 50 pcs" data-placeholder-de="z. B. 2 Geräte / 50 Stück"></div><div class="field"><label for="req-geography" data-en="Delivery location" data-de="Lieferort"></label><input id="req-geography" type="text" data-placeholder-en="e.g. Germany / EU" data-placeholder-de="z. B. Deutschland / EU"></div><div class="field"><label for="req-needby" data-en="When do you need it?" data-de="Gewünschter Liefertermin"></label><input id="req-needby" type="text" data-placeholder-en="e.g. within 3 weeks / urgent line-down" data-placeholder-de="z. B. innerhalb von 3 Wochen / Produktionsstillstand"></div><div class="field"><label for="req-budget"><span data-en="Budget or target acquisition cost" data-de="Budget oder Preisvorstellung"></span> <span style="font-weight:400" data-en="(optional)" data-de="(optional)"></span></label><input id="req-budget" type="text" data-placeholder-en="e.g. ≤ €25,000 delivered" data-placeholder-de="z. B. ≤ 25.000 € geliefert"></div><div class="field"><label><span data-en="Which evidence matters for this purchase?" data-de="Welche Nachweise sind für diese Beschaffung wichtig?"></span> <span style="font-weight:400" data-en="(select any)" data-de="(Mehrfachauswahl möglich)"></span></label><div class="inline-checks"><label class="check-chip"><input type="checkbox" data-evidence value="Manufacturer traceability" data-de-value="Herstellerrückverfolgbarkeit"><span data-en="Manufacturer traceability" data-de="Nachweis der Herkunft vom Hersteller"></span></label><label class="check-chip"><input type="checkbox" data-evidence value="Service history" data-de-value="Servicehistorie"><span data-en="Service history" data-de="Servicehistorie"></span></label><label class="check-chip"><input type="checkbox" data-evidence value="Calibration / qualification" data-de-value="Kalibrierung / Qualifizierung"><span data-en="Calibration / qualification" data-de="Kalibrierung / Qualifizierung"></span></label><label class="check-chip"><input type="checkbox" data-evidence value="Photos / serial proof" data-de-value="Fotos / Seriennummernachweis"><span data-en="Photos / serial proof" data-de="Fotos / Seriennummer"></span></label><label class="check-chip"><input type="checkbox" data-evidence value="Certificates / release documents" data-de-value="Zertifikate / Freigabedokumente"><span data-en="Certificates / release documents" data-de="Zertifikate / Freigabeunterlagen"></span></label></div></div><div class="wizard-actions"><button class="btn ghost" type="button" data-prev data-en="← Back" data-de="← Zurück"></button><button class="btn" type="button" data-next data-en="Review brief →" data-de="Angaben prüfen →"></button></div></section><section class="wizard-step" data-wizard-step="3" hidden><h2 style="font-family:var(--serif);font-weight:500;margin-top:0" data-en="Here is the requirement we will start from." data-de="Damit können wir Ihre Anfrage bearbeiten."></h2><p style="font-size:12px;color:#65736e" data-en="This is not a contract and it does not need to be perfect. It gives our engines a structured starting point, so any follow-up questions can be specific instead of generic." data-de="Ihre Angaben müssen noch nicht vollständig sein. Wir nutzen sie, um passende Produkte zu finden und offene Fragen gezielt zu klären. Eine Bestellung entsteht dadurch nicht."></p><div class="brief-preview" id="brief-preview"></div><h3 style="font-family:var(--serif);font-weight:500;margin-top:22px" data-en="Who should we respond to?" data-de="Wie können wir Sie erreichen?"></h3><div class="field"><label for="req-company" data-en="Company" data-de="Unternehmen"></label><input id="req-company" type="text"></div><div class="field"><label for="req-name" data-en="Name" data-de="Name"></label><input id="req-name" type="text"></div><div class="field"><label for="req-email" data-en="Business email" data-de="Geschäftliche E-Mail"></label><input id="req-email" type="email"></div><div class="wizard-actions"><button class="btn ghost" type="button" data-prev data-en="← Back" data-de="← Zurück"></button><button class="btn" type="button" data-next data-en="Final check →" data-de="Zur Zusammenfassung →"></button></div></section><section class="wizard-step" data-wizard-step="4" hidden><h2 style="font-family:var(--serif);font-weight:500;margin-top:0" data-en="Ready to send." data-de="Ihre Anfrage ist bereit."></h2><div class="brief-preview" id="final-brief"></div><p style="font-size:10px;color:#6b7873;margin-top:14px" data-en="By contacting Aurenoeva you ask NOEVA Systems e.K. to process the submitted information so we can respond to this B2B procurement enquiry. See our <a href='privacy.html' style='color:var(--clay)'>Privacy Policy</a>. Sending an enquiry does not create an order or purchase obligation." data-de="Mit der Kontaktaufnahme bitten Sie NOEVA Systems e.K., die übermittelten Angaben zur Bearbeitung dieser geschäftlichen Beschaffungsanfrage zu verarbeiten. Weitere Informationen finden Sie in unserer <a href='privacy.html' style='color:var(--clay)'>Datenschutzerklärung</a>. Durch das Absenden entsteht weder eine Bestellung noch eine Kaufverpflichtung."></p><div id="requirement-status" class="form-status" role="status" hidden></div><div class="wizard-actions"><button class="btn ghost" type="button" data-prev data-en="← Back" data-de="← Zurück"></button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="copy-brief" type="button" data-en="Copy summary" data-de="Zusammenfassung kopieren"></button><button class="btn clay" id="email-brief" type="button" data-en="Send enquiry →" data-de="Anfrage senden →"></button></div></div><div class="notice" style="margin-top:14px" data-en="What happens next: Aurenoeva reviews the structured requirement, resolves the first open questions and begins the appropriate discovery and qualification path. If information is missing, we ask only for the details that materially affect the search or decision." data-de="So geht es weiter: Wir prüfen Ihre Anfrage, klären offene Punkte und suchen nach geeigneten Bezugsquellen. Falls Angaben fehlen, melden wir uns mit gezielten Rückfragen."></div></section></div></div><aside class="side-note"><div class="eyebrow" style="color:#d2b06b" data-en="Why this is shorter" data-de="Warum eine kurze Anfrage ausreicht"></div><h3 data-en="You should not have to classify the market for us." data-de="Sie müssen nicht schon alle Lieferanten kennen."></h3><p data-en="Traditional RFQ forms often make the buyer do the supplier’s classification work. Aurenoeva reverses that:" data-de="Bei vielen Anfrageformularen müssen Sie bereits zahlreiche Details kennen. Bei Aurenoeva beginnen Sie einfach mit den Informationen, die Ihnen vorliegen:"></p><ol><li data-en="Start with the facts you actually know." data-de="Starten Sie mit den Fakten, die Sie wirklich kennen."></li><li data-en="Select catalogue matches when they exist, so exact part numbers travel with the enquiry." data-de="Übernehmen Sie passende Katalogtreffer direkt in Ihre Anfrage."></li><li data-en="Let the software resolve category, identity and missing context." data-de="Wir helfen, das richtige Produkt und fehlende Angaben zu bestimmen."></li><li data-en="Answer deeper questions only when they matter." data-de="Weitere Fragen stellen wir nur, wenn sie für die Beschaffung wichtig sind."></li><li data-en="Receive qualified options instead of a wall of listings." data-de="Sie erhalten passende Optionen statt unübersichtlicher Trefferlisten."></li></ol><p data-en="No account is required to start." data-de="Zum Start ist kein Konto erforderlich."></p></aside></div></section></main><footer id="site-footer" class="site-footer"></footer><script src="assets/js/site.js?v=d2451bdfbbc2"></script><script defer src="assets/js/catalogue-browser.js?v=d2451bdfbbc2"></script><script defer src="assets/js/catalogue-translation.js?v=d2451bdfbbc2"></script></body></html>
