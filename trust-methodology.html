<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence & methodology — Aurenoeva</title><meta name="description" content="Aurenoeva keeps product claims, evidence, uncertainty, provenance, risk and comparable acquisition cost visible throughout technical procurement."><link rel="stylesheet" href="assets/css/site.css?v=8.2.6.8"><meta name="theme-color" content="#0E3A33"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/brand/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/img/brand/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"></head><body><a class="skip" href="#main">Skip to content</a><header id="site-header" class="site-header"></header><main id="main"><section class="page-hero"><div class="wrap"><div class="eyebrow" data-en="Evidence, provenance and uncertainty" data-de="Nachweise, Herkunft und Unsicherheit"></div><h1 data-en="We show what is known — and what still isn’t." data-de="Wir zeigen, was belegt ist – und was noch offen bleibt."></h1><p data-en="A supplier statement can be useful without being proof. A document can be relevant without answering every question. Aurenoeva keeps those distinctions visible, because difficult technical procurement becomes safer when confidence has a reason behind it." data-de="Eine Lieferantenaussage kann hilfreich sein, ohne bereits ein Beleg zu sein. Ein Dokument kann relevant sein, ohne jede Frage zu beantworten. Aurenoeva hält diese Unterschiede sichtbar, denn anspruchsvolle technische Beschaffung wird belastbarer, wenn Vertrauen auf nachvollziehbaren Gründen beruht."></p></div></section><section class="section"><div class="wrap content-grid"><aside class="toc"><a href="#principles" data-en="Principles" data-de="Grundsätze"></a><a href="#states" data-en="Evidence states" data-de="Nachweisstatus"></a><a href="#cost" data-en="True acquisition cost" data-de="Tatsächliche Beschaffungskosten"></a><a href="#limits" data-en="Limits" data-de="Grenzen"></a></aside><div class="prose"><h2 id="principles" data-en="Four simple rules behind the methodology" data-de="Vier einfache Regeln hinter der Methodik"></h2><div class="cards-4"><article class="card"><div class="ref">01</div><h3 data-en="Keep the source" data-de="Quelle erhalten"></h3><p data-en="Important facts stay connected to where they came from: manufacturer material, supplier statement, document, capture, inspection or another evidence object." data-de="Wichtige Fakten bleiben mit ihrer Herkunft verbunden: Herstellerunterlage, Lieferantenaussage, Dokument, Erfassung, Prüfung oder anderes Nachweisobjekt."></p></article><article class="card"><div class="ref">02</div><h3 data-en="Show uncertainty" data-de="Unsicherheit zeigen"></h3><p data-en="Unknowns, assumptions and conflicting information remain visible instead of being quietly converted into certainty." data-de="Unbekannte Punkte, Annahmen und widersprüchliche Informationen bleiben sichtbar, statt stillschweigend zu Gewissheiten zu werden."></p></article><article class="card"><div class="ref">03</div><h3 data-en="Do not mix unlike things" data-de="Unterschiedliches getrennt halten"></h3><p data-en="Technical fit, evidence strength, supplier risk and economics inform one decision, but they are not interchangeable." data-de="Technische Passung, Nachweisstärke, Lieferantenrisiko und Wirtschaftlichkeit fließen in eine Entscheidung ein, sind aber nicht austauschbar."></p></article><article class="card"><div class="ref">04</div><h3 data-en="Keep the decision trail" data-de="Entscheidungsweg erhalten"></h3><p data-en="The chosen route remains connected to the evidence, conditions and open questions that existed when the decision was made." data-de="Der gewählte Beschaffungsweg bleibt mit den Nachweisen, Bedingungen und offenen Punkten verbunden, die zum Entscheidungszeitpunkt vorlagen."></p></article></div><h2 id="states" data-en="Evidence states in plain language" data-de="Nachweisstatus in klarer Sprache"></h2><table class="matrix"><thead><tr><th data-en="State" data-de="Status"></th><th data-en="What it means" data-de="Bedeutung"></th></tr></thead><tbody><tr><td data-en="Known" data-de="Bekannt"></td><td data-en="A fact has been directly provided or otherwise established as an input." data-de="Ein Fakt wurde direkt angegeben oder als Ausgangsinformation anderweitig festgestellt."></td></tr><tr><td data-en="Inferred" data-de="Abgeleitet"></td><td data-en="A conclusion is derived from available facts and remains clearly distinguishable from a verified fact." data-de="Eine Schlussfolgerung wird aus vorhandenen Fakten abgeleitet und bleibt klar von einem verifizierten Fakt getrennt."></td></tr><tr><td data-en="Claimed" data-de="Behauptet"></td><td data-en="A supplier or another source says it is true, but supporting proof is not yet sufficient." data-de="Ein Lieferant oder eine andere Quelle macht eine Aussage, für die noch kein ausreichender Beleg vorliegt."></td></tr><tr><td data-en="Supported" data-de="Gestützt"></td><td data-en="Consistent documentary or source evidence supports the statement." data-de="Konsistente Dokumente oder Quellen stützen die Aussage."></td></tr><tr><td data-en="Verified" data-de="Verifiziert"></td><td data-en="The required verification step for this context has been satisfied." data-de="Der für diesen Kontext erforderliche Prüfschritt wurde erfüllt."></td></tr><tr><td data-en="Conflict" data-de="Widerspruch"></td><td data-en="Material sources disagree and the discrepancy still needs to be resolved." data-de="Wesentliche Quellen widersprechen sich; die Abweichung muss noch geklärt werden."></td></tr><tr><td data-en="Missing" data-de="Fehlend"></td><td data-en="A relevant field or evidence item is still absent." data-de="Ein relevantes Feld oder ein benötigter Nachweis fehlt noch."></td></tr></tbody></table><h2 id="cost" data-en="The cheapest quote is not always the cheapest acquisition" data-de="Das günstigste Angebot ist nicht immer die günstigste Beschaffung"></h2><p data-en="The asking price is only the visible starting point. When relevant evidence is available, Aurenoeva can add freight, inspection, known remediation, calibration or qualification, taxes and other material adjustments to create a more comparable acquisition-cost picture." data-de="Der Angebotspreis ist nur der sichtbare Ausgangspunkt. Wenn die nötigen Informationen vorliegen, kann Aurenoeva Fracht, Prüfung, bekannte Aufbereitung, Kalibrierung oder Qualifizierung, Steuern und weitere relevante Faktoren zu einem besser vergleichbaren Beschaffungskostenbild zusammenführen."></p><h2 id="limits" data-en="What this method does not promise" data-de="Was diese Methodik nicht verspricht"></h2><div class="notice" data-en="Evidence confidence is not a guarantee that every future failure, regulatory outcome or supplier event can be predicted. The purpose is more practical: make the available proof, remaining uncertainty and commercial trade-offs clearer before you commit." data-de="Nachweisstärke ist keine Garantie dafür, dass sich jeder spätere Ausfall, jede regulatorische Entwicklung oder jedes Lieferantenereignis vorhersagen lässt. Der praktische Zweck ist ein anderer: vorhandene Belege, verbleibende Unsicherheit und kommerzielle Zielkonflikte vor der Entscheidung deutlich sichtbar zu machen."></div></div></div></section></main><footer id="site-footer" class="site-footer"></footer><script src="assets/js/site.js?v=8.2.6.8"></script></body></html>
