<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence & methodology — Aurenoeva</title><meta name="description" content="Aurenoeva keeps product claims, evidence, uncertainty, provenance, risk and comparable acquisition cost visible throughout technical procurement."><link rel="stylesheet" href="assets/css/site.css?v=8.2.6.8"><meta name="theme-color" content="#0E3A33"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/brand/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/img/brand/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"></head><body><a class="skip" href="#main">Skip to content</a><header id="site-header" class="site-header"></header><main id="main"><section class="page-hero"><div class="wrap"><div class="eyebrow" data-en="Evidence, provenance and uncertainty" data-de="Nachweise und transparente Entscheidungen"></div><h1 data-en="We show what is known — and what still isn’t." data-de="Wir zeigen, was belegt ist – und was noch offen bleibt."></h1><p data-en="A supplier statement can be useful without being proof. A document can be relevant without answering every question. Aurenoeva keeps those distinctions visible, because difficult technical procurement becomes safer when confidence has a reason behind it." data-de="Nicht jede Lieferantenangabe ist bereits geprüft. Auch ein Dokument beantwortet nicht automatisch alle Fragen. Wir zeigen deshalb klar, was belegt ist, welche Angaben noch geprüft werden und wo Informationen fehlen."></p></div></section><section class="section"><div class="wrap content-grid"><aside class="toc"><a href="#principles" data-en="Principles" data-de="Grundsätze"></a><a href="#states" data-en="Evidence states" data-de="Nachweisstatus"></a><a href="#cost" data-en="True acquisition cost" data-de="Tatsächliche Beschaffungskosten"></a><a href="#limits" data-en="Limits" data-de="Grenzen"></a></aside><div class="prose"><h2 id="principles" data-en="Four simple rules behind the methodology" data-de="Vier Grundsätze unserer Arbeitsweise"></h2><div class="cards-4"><article class="card"><div class="ref">01</div><h3 data-en="Keep the source" data-de="Quellen dokumentieren"></h3><p data-en="Important facts stay connected to where they came from: manufacturer material, supplier statement, document, capture, inspection or another evidence object." data-de="Bei wichtigen Angaben halten wir fest, woher sie stammen – etwa aus Herstellerunterlagen, Lieferantenauskünften oder Prüfberichten."></p></article><article class="card"><div class="ref">02</div><h3 data-en="Show uncertainty" data-de="Offene Fragen benennen"></h3><p data-en="Unknowns, assumptions and conflicting information remain visible instead of being quietly converted into certainty." data-de="Fehlende oder widersprüchliche Angaben kennzeichnen wir ausdrücklich, statt sie als gesichert darzustellen."></p></article><article class="card"><div class="ref">03</div><h3 data-en="Do not mix unlike things" data-de="Kriterien einzeln bewerten"></h3><p data-en="Technical fit, evidence strength, supplier risk and economics inform one decision, but they are not interchangeable." data-de="Technische Eignung, vorhandene Nachweise, Lieferantenrisiken und Gesamtkosten bewerten wir getrennt."></p></article><article class="card"><div class="ref">04</div><h3 data-en="Keep the decision trail" data-de="Entscheidung dokumentieren"></h3><p data-en="The chosen route remains connected to the evidence, conditions and open questions that existed when the decision was made." data-de="Wir halten fest, welche Informationen, Bedingungen und offenen Fragen der Entscheidung zugrunde lagen."></p></article></div><h2 id="states" data-en="Evidence states in plain language" data-de="So kennzeichnen wir den Prüfstand"></h2><table class="matrix"><thead><tr><th data-en="State" data-de="Status"></th><th data-en="What it means" data-de="Bedeutung"></th></tr></thead><tbody><tr><td data-en="Known" data-de="Bekannt"></td><td data-en="A fact has been directly provided or otherwise established as an input." data-de="Diese Angabe wurde erfasst, aber noch nicht unabhängig überprüft."></td></tr><tr><td data-en="Inferred" data-de="Abgeleitet"></td><td data-en="A conclusion is derived from available facts and remains clearly distinguishable from a verified fact." data-de="Diese Angabe ergibt sich aus anderen Informationen und ist noch nicht gesondert bestätigt."></td></tr><tr><td data-en="Claimed" data-de="Behauptet"></td><td data-en="A supplier or another source says it is true, but supporting proof is not yet sufficient." data-de="Eine Quelle hat diese Angabe gemacht; ein ausreichender Nachweis liegt noch nicht vor."></td></tr><tr><td data-en="Supported" data-de="Gestützt"></td><td data-en="Consistent documentary or source evidence supports the statement." data-de="Mehrere übereinstimmende Unterlagen oder Quellen sprechen für diese Angabe."></td></tr><tr><td data-en="Verified" data-de="Verifiziert"></td><td data-en="The required verification step for this context has been satisfied." data-de="Die für diesen Fall erforderliche Prüfung wurde abgeschlossen."></td></tr><tr><td data-en="Conflict" data-de="Widerspruch"></td><td data-en="Material sources disagree and the discrepancy still needs to be resolved." data-de="Die vorliegenden Angaben widersprechen sich und müssen geklärt werden."></td></tr><tr><td data-en="Missing" data-de="Fehlend"></td><td data-en="A relevant field or evidence item is still absent." data-de="Eine wichtige Angabe oder ein erforderliches Dokument fehlt."></td></tr></tbody></table><h2 id="cost" data-en="The cheapest quote is not always the cheapest acquisition" data-de="Der niedrigste Preis bedeutet nicht immer die geringsten Gesamtkosten"></h2><p data-en="The asking price is only the visible starting point. When relevant evidence is available, Aurenoeva can add freight, inspection, known remediation, calibration or qualification, taxes and other material adjustments to create a more comparable acquisition-cost picture." data-de="Zum Kaufpreis können Transport, Prüfung, Aufbereitung, Kalibrierung, Steuern und weitere Kosten hinzukommen. Soweit diese Angaben vorliegen, berücksichtigen wir sie bei der Bewertung."></p><h2 id="limits" data-en="What this method does not promise" data-de="Was unsere Prüfung leisten kann – und was nicht"></h2><div class="notice" data-en="Evidence confidence is not a guarantee that every future failure, regulatory outcome or supplier event can be predicted. The purpose is more practical: make the available proof, remaining uncertainty and commercial trade-offs clearer before you commit." data-de="Auch sorgfältige Prüfungen können nicht jedes spätere Problem ausschließen. Sie helfen aber dabei, verfügbare Nachweise, offene Fragen und wirtschaftliche Risiken vor einer Kaufentscheidung zu erkennen."></div></div></div></section></main><footer id="site-footer" class="site-footer"></footer><script src="assets/js/site.js?v=8.2.6.8"></script></body></html>
