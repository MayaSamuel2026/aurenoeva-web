<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How Aurenoeva works — Intelligent technical procurement</title><meta name="description" content="See how Aurenoeva combines proprietary procurement engines with managed sourcing from requirement and catalogue identity through evidence, compliance, transaction control, fulfilment and close."><link rel="stylesheet" href="assets/css/site.css"><meta name="theme-color" content="#0E3A33"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/brand/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/img/brand/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"></head><body><a class="skip" href="#main">Skip to content</a><header id="site-header" class="site-header"></header><main id="main"><section class="page-hero"><div class="wrap"><div class="eyebrow" data-en="Proprietary software + managed procurement" data-de="Eigene Software + geführte Beschaffung"></div><h1 data-en="The search is automated. The decision stays explainable." data-de="Die Suche wird automatisiert. Die Entscheidung bleibt nachvollziehbar."></h1><p data-en="Aurenoeva combines proprietary discovery, resolution, evidence and decision engines with hands-on procurement. The software does the repetitive market work; the workflow keeps identity, proof, risk, supplier context and true cost visible until you are ready to decide." data-de="Aurenoeva verbindet eigene Discovery-, Resolution-, Nachweis- und Entscheidungs-Engines mit aktiver technischer Beschaffung. Die Software übernimmt die wiederholbare Markt- und Datenarbeit; der Prozess hält Identität, Nachweise, Risiken, Lieferantenkontext und tatsächliche Kosten bis zur Entscheidung sichtbar."></p></div></section><section class="section"><div class="wrap content-grid"><aside class="toc"><a href="#process" data-en="The journey" data-de="Der Ablauf"></a><a href="#engines" data-en="Engine layer" data-de="Engine-Schicht"></a><a href="#decision" data-en="Decision model" data-de="Entscheidungsmodell"></a><a href="#clearance" data-en="Compliance & clearance" data-de="Compliance & Freigabe"></a><a href="#completion" data-en="Transaction & fulfilment" data-de="Transaktion & Abwicklung"></a><a href="#roles" data-en="Who does what" data-de="Rollen"></a><a href="#transaction" data-en="Commercial boundary" data-de="Kommerzieller Rahmen"></a></aside><div class="prose"><h2 id="process" data-en="From a rough need to a qualified acquisition" data-de="Vom groben Bedarf zur qualifizierten Beschaffung"></h2><p data-en="The customer journey is deliberately short. The technical work expands only where it changes the answer. That keeps the interface simple without simplifying away the things that make difficult procurement difficult." data-de="Der Kundenweg bleibt bewusst kurz. Technische Tiefe kommt nur dort hinzu, wo sie das Ergebnis verändert. So bleibt die Oberfläche einfach, ohne die entscheidenden Beschaffungsfragen zu vereinfachen."></p><div class="process-list"><div class="process-item"><div class="num">01</div><div><h3 data-en="Understand the requirement" data-de="Bedarf verstehen"></h3><p data-en="Start with what the buyer knows: a part number, an application, an existing machine, a failure situation or a plain-language brief. We structure the requirement and leave real unknowns visible." data-de="Wir starten mit dem, was der Kunde weiß: Teilenummer, Anwendung, bestehende Anlage, Ausfallsituation oder eine Beschreibung in eigenen Worten. Daraus wird ein strukturierter Bedarf; echte Unklarheiten bleiben sichtbar."></p></div><span class="tag">Requirement Lens</span></div><div class="process-item"><div class="num">02</div><div><h3 data-en="Discover plausible supply" data-de="Plausible Lieferquellen finden"></h3><p data-en="Our discovery and watch layer searches relevant manufacturer information, specialist suppliers, known inventory and approved sources, then brings possible matches into one working set." data-de="Unsere Discovery- und Watch-Schicht durchsucht relevante Herstellerinformationen, Spezialanbieter, bekannte Bestände und freigegebene Quellen und führt mögliche Treffer in einem Arbeitsbestand zusammen."></p></div><span class="tag">Discovery &amp; Watch</span></div><div class="process-item"><div class="num">03</div><div><h3 data-en="Resolve the exact identity" data-de="Exakte Identität klären"></h3><p data-en="Manufacturer, model, part number, option codes, serial information, lifecycle status and replacement relationships are reconciled before unlike items are compared as if they were the same." data-de="Hersteller, Modell, Teilenummer, Optionscodes, Serieninformationen, Lebenszyklusstatus und Ersatzbeziehungen werden abgeglichen, bevor unterschiedliche Produkte fälschlich als gleich verglichen werden."></p></div><span class="tag">Identity Resolution</span></div><div class="process-item"><div class="num">04</div><div><h3 data-en="Build the evidence picture" data-de="Nachweislage aufbauen"></h3><p data-en="Documents, photos, service history, calibration or qualification records and supplier statements stay connected to the candidate they describe. Claims and proof are not treated as the same thing." data-de="Dokumente, Fotos, Servicehistorie, Kalibrier- oder Qualifizierungsnachweise und Lieferantenaussagen bleiben mit dem jeweiligen Kandidaten verbunden. Aussage und Beleg werden nicht gleichgesetzt."></p></div><span class="tag">Evidence Passport</span></div><div class="process-item"><div class="num">05</div><div><h3 data-en="Make risk visible" data-de="Risiken sichtbar machen"></h3><p data-en="Technical, evidence, supplier, fulfilment and commercial risks are kept separate. That makes it clear whether a concern is about the product itself, the proof behind it, the counterparty or the route to delivery." data-de="Technische, nachweisbezogene, lieferantenbezogene, logistische und kommerzielle Risiken bleiben getrennt. Dadurch ist sichtbar, ob ein Problem am Produkt, an den Belegen, am Geschäftspartner oder an der Lieferung liegt."></p></div><span class="tag" data-en="Risk model" data-de="Risikomodell"></span></div><div class="process-item"><div class="num">06</div><div><h3 data-en="Compare the real economics" data-de="Tatsächliche Kosten vergleichen"></h3><p data-en="The visible asking price is only one component. Where relevant, we reconcile freight, inspection, remediation, calibration or qualification, taxes and other acquisition adjustments into a comparable cost picture." data-de="Der sichtbare Angebotspreis ist nur ein Bestandteil. Wo relevant, führen wir Fracht, Prüfung, bekannte Aufbereitung, Kalibrierung oder Qualifizierung, Steuern und weitere Beschaffungsfaktoren zu einem vergleichbaren Kostenbild zusammen."></p></div><span class="tag">Acquisition Instrument</span></div><div class="process-item"><div class="num">07</div><div><h3 data-en="Choose with the conditions visible" data-de="Mit sichtbaren Bedingungen entscheiden"></h3><p data-en="Qualified options are presented with the evidence, open questions and conditions that matter. The aim is not to hide complexity in a score, but to make the trade-offs easy to understand." data-de="Qualifizierte Optionen werden mit relevanten Nachweisen, offenen Punkten und Bedingungen dargestellt. Ziel ist nicht, Komplexität in einer Zahl zu verstecken, sondern die Zielkonflikte verständlich zu machen."></p></div><span class="tag">Decision Field</span></div><div class="process-item"><div class="num">08</div><div><h3 data-en="Clear the transaction conditions" data-de="Transaktionsbedingungen klären"></h3><p data-en="Where relevant, product, party, country, end-use and documentary requirements are checked against the transaction context. Open or conditional points remain visible instead of being treated as automatically cleared." data-de="Wo relevant, werden Produkt, Parteien, Länderbezug, Endverwendung und Dokumentationsanforderungen im konkreten Transaktionskontext geprüft. Offene oder bedingte Punkte bleiben sichtbar und gelten nicht automatisch als freigegeben."></p></div><span class="tag" data-en="Compliance & applicability" data-de="Compliance & Anwendbarkeit"></span></div><div class="process-item"><div class="num">09</div><div><h3 data-en="Agree the commercial structure" data-de="Kommerzielle Struktur vereinbaren"></h3><p data-en="The seller, buyer, Aurenoeva and any specialist parties remain explicitly identified. Transaction documents, responsibilities, funding conditions and release requirements are tied to the same acquisition." data-de="Verkäufer, Käufer, Aurenoeva und gegebenenfalls weitere Fachparteien bleiben eindeutig benannt. Transaktionsdokumente, Verantwortlichkeiten, Zahlungsbedingungen und Freigabevoraussetzungen werden derselben Beschaffung zugeordnet."></p></div><span class="tag" data-en="Transaction & role control" data-de="Transaktion & Rollen"></span></div><div class="process-item"><div class="num">10</div><div><h3 data-en="Fulfil, accept and close" data-de="Abwickeln, abnehmen und abschließen"></h3><p data-en="Inspection or release, dispatch, delivery, acceptance, exceptions and settlement evidence remain connected. The acquisition closes with an auditable record rather than disappearing after the supplier is chosen." data-de="Prüfung oder Freigabe, Versand, Lieferung, Abnahme, Ausnahmen und Zahlungsnachweise bleiben verbunden. Die Beschaffung endet mit einer nachvollziehbaren Akte, statt nach der Lieferantenauswahl zu verschwinden."></p></div><span class="tag" data-en="Fulfilment & close" data-de="Abwicklung & Abschluss"></span></div><div class="process-item"><div class="num">11</div><div><h3 data-en="Keep the acquisition record" data-de="Beschaffungsakte erhalten"></h3><p data-en="The selected product, supplier, documents, commercial terms, logistics and issue history remain connected for future support, repeat sourcing and learning." data-de="Ausgewähltes Produkt, Lieferant, Dokumente, Konditionen, Logistik und Vorgangshistorie bleiben für Support, Wiederbeschaffung und künftiges Lernen verbunden."></p></div><span class="tag" data-en="Acquisition record" data-de="Beschaffungsakte"></span></div></div><h2 id="engines" data-en="The software layer behind the simple interface" data-de="Die Software-Schicht hinter der einfachen Oberfläche"></h2><p data-en="Aurenoeva is not a manual search service wrapped in a form. Its proprietary engines are designed to do the repeatable work across markets: interpreting requirements, discovering and watching sources, extracting and normalising data, resolving identity, preserving evidence and detecting change. Human procurement work is then concentrated where judgement, supplier dialogue and commercial context actually matter." data-de="Aurenoeva ist kein manueller Suchservice hinter einem Formular. Die eigenen Engines übernehmen wiederholbare Arbeit über Märkte hinweg: Bedarfe interpretieren, Quellen entdecken und beobachten, Daten extrahieren und normalisieren, Produktidentitäten abgleichen, Nachweise erhalten und Veränderungen erkennen. Menschliche Beschaffungsarbeit konzentriert sich damit auf die Punkte, an denen fachliche Beurteilung, Lieferantendialog und kommerzieller Kontext wirklich zählen."></p><div class="cards-4"><article class="card"><div class="ref">ENGINE 01</div><h3 data-en="Requirement intelligence" data-de="Bedarfsintelligenz"></h3><p data-en="Understands identifiers, applications, constraints and missing information, then turns them into a structured search problem." data-de="Versteht Kennungen, Anwendungen, Randbedingungen und fehlende Informationen und macht daraus ein strukturiertes Suchproblem."></p></article><article class="card"><div class="ref">ENGINE 02</div><h3 data-en="Discovery & watch" data-de="Discovery &amp; Watch"></h3><p data-en="Finds relevant sources and revisits them so new supply, changed availability and material updates can be detected." data-de="Findet relevante Quellen und prüft sie erneut, damit neue Angebote, geänderte Verfügbarkeit und wesentliche Aktualisierungen erkannt werden können."></p></article><article class="card"><div class="ref">ENGINE 03</div><h3 data-en="Evidence & resolution" data-de="Nachweise &amp; Auflösung"></h3><p data-en="Normalises product and supplier identity, connects claims to source evidence and keeps gaps or contradictions visible." data-de="Normalisiert Produkt- und Lieferantenidentität, verbindet Aussagen mit Quellen und hält Lücken oder Widersprüche sichtbar."></p></article><article class="card"><div class="ref">ENGINE 04</div><h3 data-en="Acquisition intelligence" data-de="Beschaffungsintelligenz"></h3><p data-en="Combines technical fit, evidence, risk and true cost into a comparable decision context without collapsing them into one opaque score." data-de="Führt technische Passung, Nachweise, Risiko und tatsächliche Kosten in einem vergleichbaren Entscheidungskontext zusammen, ohne alles in einer undurchsichtigen Punktzahl zu verstecken."></p></article></div><h2 id="decision" data-en="A recommendation you can question" data-de="Eine Empfehlung, die Sie hinterfragen können"></h2><p data-en="Technical fit, evidence strength, risk and acquisition cost remain separately inspectable. Aurenoeva can recommend a route, but the reasoning, conditions and remaining uncertainty stay visible. That is what makes the recommendation useful for a real procurement decision rather than just another ranking." data-de="Technische Passung, Nachweisstärke, Risiko und Beschaffungskosten bleiben getrennt prüfbar. Aurenoeva kann einen Beschaffungsweg empfehlen, doch Begründung, Bedingungen und verbleibende Unsicherheit bleiben sichtbar. Genau das macht die Empfehlung für eine reale Beschaffungsentscheidung nutzbar – statt sie zu einem weiteren Ranking zu machen."></p><h2 id="clearance" data-en="Compliance is a stage, not a hidden assumption" data-de="Compliance ist ein eigener Schritt – keine stillschweigende Annahme"></h2><p data-en="Once a credible acquisition route exists, Aurenoeva can bring the relevant transaction context into the shared NOEVA compliance layer. Depending on the case, this can include the product, parties, countries, end use, documentation, certifications and other transaction-specific conditions. The result is not reduced to a marketing badge: conditions, review requirements and unresolved points remain explicit before contracting, funding or dispatch." data-de="Sobald ein belastbarer Beschaffungsweg vorliegt, kann Aurenoeva den relevanten Transaktionskontext in die gemeinsame NOEVA-Compliance-Schicht überführen. Je nach Fall betrifft das Produkt, Parteien, Länder, Endverwendung, Dokumentation, Zertifizierungen und weitere transaktionsspezifische Anforderungen. Das Ergebnis wird nicht auf ein Marketing-Siegel reduziert: Bedingungen, Prüfbedarf und offene Punkte bleiben vor Vertrag, Zahlung oder Versand ausdrücklich sichtbar."></p><div class="clearance-states"><span data-en="Clear" data-de="Freigegeben"></span><span data-en="Clear with conditions" data-de="Mit Bedingungen"></span><span data-en="Review required" data-de="Prüfung erforderlich"></span><span data-en="Hold" data-de="Zurückgestellt"></span></div><p class="muted-note" data-en="The exact checks depend on the product and transaction. Aurenoeva does not imply that every enquiry requires the same regulatory analysis." data-de="Welche Prüfungen erforderlich sind, hängt vom Produkt und vom konkreten Vorgang ab. Aurenoeva unterstellt nicht, dass jede Anfrage dieselbe regulatorische Prüfung benötigt."></p><h2 id="completion" data-en="After the decision: assemble, agree, fund, fulfil, close" data-de="Nach der Entscheidung: zusammenführen, vereinbaren, finanzieren, abwickeln, abschließen"></h2><p data-en="Finding a supplier is not treated as the end of the job. The selected item, supplier, evidence and transaction context can continue through a controlled commercial path." data-de="Die Auswahl eines Lieferanten ist nicht das Ende des Vorgangs. Ausgewähltes Teil, Lieferant, Nachweise und Transaktionskontext können in einem kontrollierten kommerziellen Ablauf weitergeführt werden."></p><div class="completion-flow"><article><span>01</span><b data-en="ASSEMBLE" data-de="ZUSAMMENFÜHREN"></b><p data-en="Product identity, supplier, parties, evidence, price and transaction facts are brought into one record." data-de="Produktidentität, Lieferant, Parteien, Nachweise, Preis und Transaktionsdaten werden in einer Akte zusammengeführt."></p></article><article><span>02</span><b data-en="AGREE" data-de="VEREINBAREN"></b><p data-en="Roles, conditions and the applicable transaction documents are made explicit before commitment." data-de="Rollen, Bedingungen und die anwendbaren Transaktionsdokumente werden vor der Bindung eindeutig festgelegt."></p></article><article><span>03</span><b data-en="FUND" data-de="FINANZIEREN"></b><p data-en="Funding obligations, release conditions and expected monetary movements remain tied to the transaction." data-de="Zahlungsverpflichtungen, Freigabebedingungen und erwartete Geldbewegungen bleiben an die Transaktion gebunden."></p></article><article><span>04</span><b data-en="FULFIL" data-de="ABWICKELN"></b><p data-en="Inspection or release, dispatch, delivery, acceptance and exceptions are recorded against the same acquisition." data-de="Prüfung oder Freigabe, Versand, Lieferung, Abnahme und Ausnahmen werden derselben Beschaffung zugeordnet."></p></article><article><span>05</span><b data-en="CLOSE" data-de="ABSCHLIESSEN"></b><p data-en="Settlement and evidence are reconciled and the acquisition becomes a durable record." data-de="Zahlungs- und Nachweisdaten werden abgeglichen und die Beschaffung wird als dauerhafte Akte abgeschlossen."></p></article></div><div class="role-boundary"><strong data-en="Roles stay explicit." data-de="Rollen bleiben eindeutig."></strong><span data-en="Aurenoeva is the procurement and brokerage orchestrator. It does not silently become the seller, title holder, inventory holder, importer/exporter, warranty provider or holder of seller funds. The actual roles are defined for the specific transaction." data-de="Aurenoeva ist der Beschaffungs- und Brokerage-Orchestrator. Aurenoeva wird nicht stillschweigend zum Verkäufer, Eigentümer, Lagerhalter, Importeur/Exporteur, Garantiegeber oder Verwahrer von Verkäufergeldern. Die tatsächlichen Rollen werden für die konkrete Transaktion festgelegt."></span></div><h2 id="roles" data-en="Who does what" data-de="Wer übernimmt was?"></h2><table class="matrix"><thead><tr><th data-en="Role" data-de="Rolle"></th><th data-en="Responsibility" data-de="Aufgabe"></th></tr></thead><tbody><tr><td data-en="Buyer" data-de="Kunde"></td><td data-en="Explains the operational need, reviews qualified options and approves the acquisition route." data-de="Beschreibt den operativen Bedarf, prüft qualifizierte Optionen und entscheidet über den Beschaffungsweg."></td></tr><tr><td>Aurenoeva</td><td data-en="Structures the requirement, runs the sourcing and evidence workflow, compares credible candidates and manages supplier engagement." data-de="Strukturiert den Bedarf, steuert Suche und Nachweisprozess, vergleicht belastbare Kandidaten und koordiniert die Lieferantenansprache."></td></tr><tr><td data-en="Supplier" data-de="Lieferant"></td><td data-en="Provides the product or asset, commercial terms and supporting evidence, then fulfils the agreed supply obligation." data-de="Stellt Produkt oder Anlage, Konditionen und Nachweise bereit und erfüllt anschließend die vereinbarte Lieferleistung."></td></tr><tr><td>NOEVA CORE OS</td><td data-en="Provides shared discovery, crawling, extraction, evidence, workflow, CRM and compliance capabilities used by Aurenoeva." data-de="Stellt gemeinsame Discovery-, Crawling-, Extraktions-, Nachweis-, Workflow-, CRM- und Compliance-Funktionen bereit, die Aurenoeva nutzt."></td></tr></tbody></table><h2 id="transaction" data-en="The commercial boundary" data-de="Der kommerzielle Rahmen"></h2><p data-en="The public website starts the procurement journey; it is not an anonymous marketplace checkout. The commercial structure can vary with the asset, supplier, jurisdiction and risk. Seller-of-record, payment, delivery, acceptance and warranty terms are therefore defined in the documentation for the specific transaction." data-de="Die öffentliche Website startet den Beschaffungsprozess; sie ist kein anonymer Marktplatz-Checkout. Die kommerzielle Struktur kann je nach Produkt, Lieferant, Land und Risiko variieren. Verkäuferstellung, Zahlung, Lieferung, Abnahme und Gewährleistung werden deshalb im konkreten Vorgang eindeutig festgelegt."></p></div></div></section></main><footer id="site-footer" class="site-footer"></footer><script src="assets/js/site.js"></script></body></html>
