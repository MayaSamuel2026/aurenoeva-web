name: Qualify and publish Aurenoeva

on:
  workflow_dispatch:
  # Catalogue integration release: reuse full qualification before Hostinger publication.
  # Catalogue 22 October: publish UTF-8 safe length handling and regression
  # coverage after isolating a malformed-UTF-8 JsonException in live batches.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'deployment/site/procurement/**'
      - 'tests/test_procurement_urgent_supplier_leads.php'
      - 'tests/test_procurement_urgent_supplier_drafts.php'
      - 'tests/test_procurement_worldwide_php.php'
      - 'tests/test_procurement_rfq_duplicates.php'
      - 'tests/test_procurement_price_reminders.php'
      - 'tests/test_supplier_matching.php'
      - 'tests/test_procurement_smtp.php'
      - 'tests/test_procurement_housekeeping.php'
      - 'tests/test_procurement_quality.php'
      - 'tests/test_procurement_inbox.php'
      - 'hotfix/v8.2.6.12/catalogue-sync.php'
      - 'hotfix/v8.2.6.12/tests/catalogue_sync_test.php'
      - 'hotfix/v8.2.6.11/catalogue-search.php'
      - 'hotfix/v8.2.6.10/catalogue_local.php'
      - 'hotfix/v8.2.6.10/catalogue_local.php'
      - 'hotfix/catalogue-browser/**'
      - 'hotfix/buyer-flow/**'
      - 'hotfix/international-seo/**'
      - 'tests/test_international_seo.php'
      - 'tests/test_buyer_flow.js'
      - 'hotfix/v8.2.6.8/index.html'
      - 'hotfix/v8.2.6.5/site.js'
      - 'hotfix/de-language-refinement/apply.py'
      - 'tests/test_catalogue_publish.py'
      - 'tests/test_catalogue_harvester.py'
      - 'tests/test_catalogue_onergys_coverage.py'
      - 'tools/catalogue_prices.py'
      - 'tools/catalogue_classification.py'
      - 'tests/test_catalogue_classification.py'
      - 'tests/test_catalogue_prices.py'
      - 'tools/catalogue_harvester.py'
      - 'tools/catalogue_publish.py'
      - 'tools/catalogue_auto_update.py'
      - 'tests/test_catalogue_auto_update.py'
      - 'config/catalogue_harvester.json'
      - 'ops/close-catalogue-gap.sh'
      - 'hotfix/catalogue-counter/**'

permissions:
  contents: write

concurrency:
  group: aurenoeva-production-final
  cancel-in-progress: false

jobs:
  qualify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct approved V7 payload
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 | base64 --decode > "$RUNNER_TEMP/aurenoeva-v7.tar.xz"
          echo "ded9b1fb9918c1c688e2a253b258f11ce0bdc0cda7d348da2c4c642c95e7e56d  $RUNNER_TEMP/aurenoeva-v7.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/aurenoeva-v7.tar.xz" -C "$RUNNER_TEMP/source"

      - name: Apply V7.1 production hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat hotfix/v7.1/site.css >> "$RUNNER_TEMP/source/site/assets/css/site.css"
          cp hotfix/v7.1/_form_common.php "$RUNNER_TEMP/source/site/_form_common.php"
          cp hotfix/v7.1/contact-submit.php "$RUNNER_TEMP/source/site/contact-submit.php"

      - name: Apply V7.2 logo lockup hotfix
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/v7.2/site.js "$RUNNER_TEMP/source/site/assets/js/site.js"
          cat hotfix/v7.2/site.css >> "$RUNNER_TEMP/source/site/assets/css/site.css"
          base64 --decode hotfix/v7.2/aurenoeva-logo-approved.b64 > "$RUNNER_TEMP/source/site/assets/img/brand/aurenoeva-logo-approved.png"

      - name: Apply V7.3 search-to-transaction journey
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/v7.3/site.js "$RUNNER_TEMP/source/site/assets/js/site.js"
          cat hotfix/v7.3/site.css >> "$RUNNER_TEMP/source/site/assets/css/site.css"
          cp hotfix/v7.3/index.html "$RUNNER_TEMP/source/site/index.html"
          cp hotfix/v7.3/how-it-works.html "$RUNNER_TEMP/source/site/how-it-works.html"
          cp hotfix/v7.3/requirement.html "$RUNNER_TEMP/source/site/requirement.html"
          cp hotfix/v7.3/catalogue-search.php "$RUNNER_TEMP/source/site/catalogue-search.php"
          cp hotfix/v7.3/requirement-submit.php "$RUNNER_TEMP/source/site/requirement-submit.php"
          cp hotfix/v7.3/privacy.html "$RUNNER_TEMP/source/site/privacy.html"
          cp hotfix/v7.3/cookies.html "$RUNNER_TEMP/source/site/cookies.html"

      - name: Apply V7.4 live CORE binding adapter
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/v7.4/_core_bridge.php "$RUNNER_TEMP/source/site/_core_bridge.php"
          cp hotfix/v7.4/core-health.php "$RUNNER_TEMP/source/site/core-health.php"
          cp hotfix/v7.4/catalogue-search.php "$RUNNER_TEMP/source/site/catalogue-search.php"
          cp hotfix/v7.4/requirement-submit.php "$RUNNER_TEMP/source/site/requirement-submit.php"
          cp hotfix/v7.4/site.js "$RUNNER_TEMP/source/site/assets/js/site.js"
          while IFS= read -r -d '' f; do
            sed -i 's#assets/js/site.js\([?][^"]*\)\?#assets/js/site.js?v=7.4.1#g' "$f"
            sed -i 's#assets/css/site.css\([?][^"]*\)\?#assets/css/site.css?v=7.4.1#g' "$f"
          done < <(find "$RUNNER_TEMP/source/site" -maxdepth 1 -type f -name '*.html' -print0)

      - name: Apply V8.2.6.8 cache-safe navigation checkpoint
        shell: bash
        run: |
          set -euo pipefail

          cp hotfix/v8.2.6.8/index.html "$RUNNER_TEMP/source/site/index.html"
          cmp --silent hotfix/v8.2.6.8/index.html "$RUNNER_TEMP/source/site/index.html"

          # Contact transport repair: accept apex/www as the same origin and
          # add SMTP -> PHP mail() -> direct sendmail fallbacks.
          cp hotfix/v8.2.6.8/_form_common.php "$RUNNER_TEMP/source/site/_form_common.php"

          # Unify all secondary-page navigation with the homepage and keep the
          # requirement path on the same information architecture.
          cp hotfix/v8.2.6.5/site.js "$RUNNER_TEMP/source/site/assets/js/site.js"
          cat hotfix/v8.2.6.5/site.css >> "$RUNNER_TEMP/source/site/assets/css/site.css"
          cp hotfix/v8.2.6.7/requirement-submit.php "$RUNNER_TEMP/source/site/requirement-submit.php"

          # Force every HTML page to load the new shared navigation and CSS.
          # The prior query string stayed at 7.4.1, allowing browsers to reuse
          # the older header JavaScript after deployment.
          while IFS= read -r -d '' f; do
            sed -i -E 's#assets/js/site\.js([?][^"]*)?#assets/js/site.js?v=8.2.6.8#g' "$f"
            sed -i -E 's#assets/css/site\.css([?][^"]*)?#assets/css/site.css?v=8.2.6.8#g' "$f"
          done < <(find "$RUNNER_TEMP/source/site" -maxdepth 1 -type f -name '*.html' -print0)

          # Completely rebuilt About page; preserve the proven contact endpoint and shared shell.
          cp hotfix/v8.2.6.2/about.html "$RUNNER_TEMP/source/site/about.html"
          cp hotfix/v8.2.6.8/contact-submit.php "$RUNNER_TEMP/source/site/contact-submit.php"
          cmp --silent hotfix/v8.2.6.2/about.html "$RUNNER_TEMP/source/site/about.html"

          mkdir -p "$RUNNER_TEMP/source/site/assets/img/v826"

          # Freeze the corrected 350x375 hero engine visual explicitly.
          base64 --decode hotfix/v8.2.6/hero-spare-parts.b64 > "$RUNNER_TEMP/source/site/assets/img/hero-spare-parts.webp"
          echo "6b5a9889271a08dc881dff28347cc351e21422661a437e75003c0c56aaebad0e  $RUNNER_TEMP/source/site/assets/img/hero-spare-parts.webp" | sha256sum -c -

          base64 --decode hotfix/v8.2.6-final/assets/sector-lab.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-lab.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-test.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-test.webp"
          cat hotfix/v8.2.6-final/assets/sector-medical.correct.b64.* | base64 --decode > "$RUNNER_TEMP/source/site/assets/img/v826/sector-medical.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-industrial.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-industrial.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-energy.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-energy.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-marine.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-marine.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-aviation.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-aviation.webp"
          cat hotfix/v8.2.6-final/assets/procurement-bg.b64.* | base64 --decode > "$RUNNER_TEMP/source/site/assets/img/v826/procurement-bg.webp"

          echo "fcb36d331c90cc0113c1cbb1f690ceaa731e41ef7ac31fb1931990f4b52cadcf  $RUNNER_TEMP/source/site/assets/img/v826/sector-lab.webp" | sha256sum -c -
          echo "3b3835eaae062a1ee92761ae90882123851545ea1c888421750332abcefb8b90  $RUNNER_TEMP/source/site/assets/img/v826/sector-test.webp" | sha256sum -c -
          echo "d8755a2862944340b153809cbc7910b754013fc159e03e496f964dc1f428878b  $RUNNER_TEMP/source/site/assets/img/v826/sector-medical.webp" | sha256sum -c -
          echo "cb8744e4780fce0ad3ca4ecd7ec6064b65ed7fef19f2d405847c3f0cdd25aba5  $RUNNER_TEMP/source/site/assets/img/v826/sector-industrial.webp" | sha256sum -c -
          echo "e3e5bdbfe24d6d60f9d6626a728ba4f6d89f78b15f10885c4825c172cb3b824a  $RUNNER_TEMP/source/site/assets/img/v826/sector-energy.webp" | sha256sum -c -
          echo "40077a0fbad52215c0ca0bed48cd8528a8afc8e43d80aba2ce1069ab31c0a8f2  $RUNNER_TEMP/source/site/assets/img/v826/sector-marine.webp" | sha256sum -c -
          echo "8e0c7524f71c83c4a7d29609abf4ba4443c29151f72debff3e0edb247ef0faa9  $RUNNER_TEMP/source/site/assets/img/v826/sector-aviation.webp" | sha256sum -c -
          echo "5543c2341d44dd43f00ecaa5933f8375ab13c84b9bd8ab34171e7db4c20e085a  $RUNNER_TEMP/source/site/assets/img/v826/procurement-bg.webp" | sha256sum -c -

          # The approved sector artwork arrived with small sequence numbers
          # baked into the upper-left corner. Remove only that corner label;
          # preserve the product illustration and the rest of the checkpoint.
          SITE_ROOT="$RUNNER_TEMP/source/site" php <<'PHP'
          <?php
          $root = getenv('SITE_ROOT');
          $files = [
              'sector-lab.webp','sector-test.webp','sector-medical.webp',
              'sector-industrial.webp','sector-energy.webp',
              'sector-marine.webp','sector-aviation.webp'
          ];
          foreach ($files as $name) {
              $path = $root . '/assets/img/v826/' . $name;
              $im = @imagecreatefromwebp($path);
              if (!$im) { fwrite(STDERR, "Cannot open $name\n"); exit(1); }
              $w = imagesx($im); $h = imagesy($im);
              $white = imagecolorallocate($im, 255, 255, 255);
              imagefilledrectangle(
                  $im,
                  0,
                  0,
                  max(18, (int)ceil($w * 0.18)),
                  max(14, (int)ceil($h * 0.12)),
                  $white
              );
              if (!imagewebp($im, $path, 92)) {
                  fwrite(STDERR, "Cannot write $name\n"); exit(1);
              }
              imagedestroy($im);
          }
          PHP

          # Publish cache-safe sector artwork under a new immutable path.
          # This avoids browsers retaining the earlier numbered WebP files.
          mkdir -p "$RUNNER_TEMP/source/site/assets/img/v8264"
          cp "$RUNNER_TEMP/source/site/assets/img/v826/sector-lab.webp" "$RUNNER_TEMP/source/site/assets/img/v8264/sector-lab.webp"
          cp "$RUNNER_TEMP/source/site/assets/img/v826/sector-test.webp" "$RUNNER_TEMP/source/site/assets/img/v8264/sector-test.webp"
          cp "$RUNNER_TEMP/source/site/assets/img/v826/sector-medical.webp" "$RUNNER_TEMP/source/site/assets/img/v8264/sector-medical.webp"
          cp "$RUNNER_TEMP/source/site/assets/img/v826/sector-industrial.webp" "$RUNNER_TEMP/source/site/assets/img/v8264/sector-industrial.webp"
          cp "$RUNNER_TEMP/source/site/assets/img/v826/sector-energy.webp" "$RUNNER_TEMP/source/site/assets/img/v8264/sector-energy.webp"
          cp "$RUNNER_TEMP/source/site/assets/img/v826/sector-marine.webp" "$RUNNER_TEMP/source/site/assets/img/v8264/sector-marine.webp"
          cp "$RUNNER_TEMP/source/site/assets/img/v826/sector-aviation.webp" "$RUNNER_TEMP/source/site/assets/img/v8264/sector-aviation.webp"

      - name: Apply V8.2.6.9 minimum revenue-loop instrumentation
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/v8.2.6.9/_form_common.php "$RUNNER_TEMP/source/site/_form_common.php"
          cp hotfix/v8.2.6.9/catalogue-search.php "$RUNNER_TEMP/source/site/catalogue-search.php"
          grep -q "aur_revenue_event_from_ledger" "$RUNNER_TEMP/source/site/_form_common.php"
          grep -q "RECOMMENDATION_SHOWN" "$RUNNER_TEMP/source/site/catalogue-search.php"
          grep -q "https://noeva-core.179-198-203-247.nip.io" "$RUNNER_TEMP/source/site/_core_bridge.php"
          grep -q "/api/public/v1/revenue/event" "$RUNNER_TEMP/source/site/_form_common.php"
          grep -q "Origin: https://aurenoeva.com" "$RUNNER_TEMP/source/site/_core_bridge.php"
          grep -q "function aur_local_mail_from" "$RUNNER_TEMP/source/site/_form_common.php"
          grep -q "\\.main-hosting\\.eu" "$RUNNER_TEMP/source/site/_form_common.php"

      - name: Qualify private Aurenoeva catalogue before website release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/catalogue_prices.py tools/catalogue_classification.py tools/catalogue_harvester.py tools/catalogue_publish.py
          bash -n ops/activate-harvester-v4.sh ops/repair-large-catalogue-publish.sh
          python3 -m unittest discover -s tests -p 'test_catalogue_*.py' -v
          php hotfix/v8.2.6.11/tests/catalogue_snapshot_test.php
          php hotfix/v8.2.6.12/tests/catalogue_sync_test.php
          cp hotfix/v8.2.6.10/catalogue_local.php "$RUNNER_TEMP/source/site/catalogue_local.php"
          cp hotfix/v8.2.6.11/catalogue-search.php "$RUNNER_TEMP/source/site/catalogue-search.php"
          cp hotfix/v8.2.6.12/catalogue-sync.php "$RUNNER_TEMP/source/site/catalogue-sync.php"
          grep -q 'atomic-snapshot-v1' "$RUNNER_TEMP/source/site/catalogue-sync.php"
          grep -q 'aur_catalogue_write_snapshot' "$RUNNER_TEMP/source/site/catalogue-sync.php"
          grep -q 'accepted_input_records' "$RUNNER_TEMP/source/site/catalogue-sync.php"
          grep -q 'catalogue-merge.lock' "$RUNNER_TEMP/source/site/catalogue-sync.php"
          grep -q 'existing_catalogue_snapshot_unreadable' "$RUNNER_TEMP/source/site/catalogue-sync.php"
          grep -q 'aurenoeva-vendor-evidence/1' "$RUNNER_TEMP/source/site/catalogue-sync.php"
          grep -q '256_000_000' "$RUNNER_TEMP/source/site/catalogue_local.php"
          php -l "$RUNNER_TEMP/source/site/catalogue-sync.php"
          php -l "$RUNNER_TEMP/source/site/catalogue_local.php"
          grep -q 'RECOMMENDATION_SHOWN' "$RUNNER_TEMP/source/site/catalogue-search.php"
          grep -q 'aur_catalogue_snapshot_search' "$RUNNER_TEMP/source/site/catalogue-search.php"
          # Requirement intake, email and operations-case endpoints stay unchanged.

      - name: Install snapshot-backed public product counter
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/catalogue-counter/catalogue-count.php "$RUNNER_TEMP/source/site/catalogue-count.php"
          cp hotfix/catalogue-counter/catalogue-counter.js "$RUNNER_TEMP/source/site/assets/js/catalogue-counter.js"
          python3 - "$RUNNER_TEMP/source/site/index.html" <<'PY'
          from pathlib import Path
          import sys
          page=Path(sys.argv[1])
          html=page.read_text(encoding='utf-8')
          marker='</head>'
          assert html.count(marker)==1 and 'catalogue-counter.js' not in html
          html=html.replace(marker,'<script defer src="assets/js/catalogue-counter.js?v=4"></script>\n'+marker,1)
          page.write_text(html,encoding='utf-8')
          PY
          php hotfix/catalogue-counter/tests/catalogue_count_test.php
          php -l "$RUNNER_TEMP/source/site/catalogue-count.php"
          node --check "$RUNNER_TEMP/source/site/assets/js/catalogue-counter.js"
          grep -q 'catalogue-counter.js?v=4' "$RUNNER_TEMP/source/site/index.html"
          grep -q 'aur_catalogue_count_file' "$RUNNER_TEMP/source/site/catalogue-count.php"
          
      - name: Include private AURENOEVA procurement workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source/site/procurement"
          # Copy the complete canonical procurement application, not a stale hardcoded subset.
          # New supplier and RFQ modules must ship in the SAME release as index.php.
          for name in index.php commercial_intelligence.php activity.php commercial-intelligence.js commercial-intelligence.css private_cases.php rfq_duplicates.php public_intake.php cycle_verification.php embargo_screen.php supplier_intelligence.php supplier_discovery.php supplier_routes.php supplier_worldwide.php supplier_matching.php supplier_rfq.php supplier_reminders.php urgent_supplier_drafts.php supplier_replies.php supplier_quality.php supplier_inbox_mime.php supplier_inbox_store.php supplier_inbox_curl.php supplier_inbox.php mail_branding.php mail_center.php supplier-inbox-cli.php supplier_portal.php staff_auth.php supplier-refresh-cli.php setup-cli.php activate.php discover.js worldwide.js workspace-tabs.js inbox-sync.js mail-center.js .htaccess; do
            cp "deployment/site/procurement/$name" "$RUNNER_TEMP/source/site/procurement/$name"
          done
          # Deploy a dedicated, release-verified logo from the exact approved brand asset.
          # This avoids dependency on a possibly stale site-wide /assets rewrite.
          cp "$RUNNER_TEMP/source/site/assets/img/brand/aurenoeva-logo-approved.png" "$RUNNER_TEMP/source/site/procurement/aurenoeva-logo.png"
          test -s "$RUNNER_TEMP/source/site/procurement/aurenoeva-logo.png"
          cmp "$RUNNER_TEMP/source/site/procurement/aurenoeva-logo.png" "$RUNNER_TEMP/source/site/assets/img/brand/aurenoeva-logo-approved.png"
          # Preserve the public index.html as default while allowing subdirectory PHP index.
          sed -i 's/^DirectoryIndex index.html$/DirectoryIndex index.html index.php/' "$RUNNER_TEMP/source/site/.htaccess"
          grep -q '^DirectoryIndex index.html index.php$' "$RUNNER_TEMP/source/site/.htaccess"
          for name in index.php commercial_intelligence.php activity.php private_cases.php public_intake.php cycle_verification.php embargo_screen.php supplier_intelligence.php supplier_discovery.php supplier_routes.php supplier_worldwide.php supplier_matching.php supplier_rfq.php supplier_replies.php supplier_quality.php supplier_inbox_mime.php supplier_inbox_store.php supplier_inbox_curl.php supplier_inbox.php mail_branding.php mail_center.php supplier-inbox-cli.php supplier_portal.php staff_auth.php supplier-refresh-cli.php setup-cli.php activate.php; do
            php -l "$RUNNER_TEMP/source/site/procurement/$name"
          done
          python3 - "$RUNNER_TEMP/source/site/index.html" <<'PY'
          import pathlib, sys
          page=pathlib.Path(sys.argv[1])
          old=page.read_text(encoding="utf-8")
          marker="<span>PROCUREMENT · COMPONENTS · INTELLIGENCE</span>"
          assert old.count(marker)==1, "footer marker drift"
          link='<span><a href="/procurement/" style="font-size:12px;color:#C9D8D3" data-en="Staff procurement" data-de="Interne Beschaffung">Staff procurement</a></span>'
          page.write_text(old.replace(marker,marker+"\n      "+link),encoding="utf-8")
          PY
          grep -q 'href="/procurement/"' "$RUNNER_TEMP/source/site/index.html"
          # WP09 integration uses the same Hostinger private case store.
          php tests/test_wp09_public_intake.php
          php tests/test_wp09_full_cycle.php
          grep -q 'aur_wp09_cycle_report' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'aur_wp09_cycle_report' "$RUNNER_TEMP/source/site/procurement/supplier-inbox-cli.php"
          grep -q "aur_public_case_capture" "$RUNNER_TEMP/source/site/requirement-submit.php"
          grep -q "'quantity'=>\$quantityValue" "$RUNNER_TEMP/source/site/requirement-submit.php"
          grep -q "quantity:i.qty" "hotfix/buyer-flow/buyer-flow.js"
                    grep -q 'aur_case_import' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'Products by sector and subcategory' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'catalogueSnapshotManufacturers' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'export_catalogue' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'Download catalogue CSV' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'catalogueVendorProductLinks' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'aur_worldwide_master_merge' "$RUNNER_TEMP/source/site/procurement/supplier_worldwide.php"
          grep -q 'aur_catalogue_merge_vendor_evidence' "$RUNNER_TEMP/source/site/catalogue-sync.php"
          # Release qualification: the permanent original case, supplier sources and
          # full-case worldwide search must ALL be present in the deployable payload.
          grep -q 'id="original-rfq-equipment"' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'id="aur-worldwide-scan-all"' "$RUNNER_TEMP/source/site/procurement/index.php"
          grep -q 'Consolidated supplier selection' "$RUNNER_TEMP/source/site/procurement/supplier_portal.php"
          grep -q 'id="aur-vendor-selection-form"' "$RUNNER_TEMP/source/site/procurement/supplier_portal.php"
