name: Qualify and publish Aurenoeva

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurenoeva-production-final
  cancel-in-progress: true

jobs:
  qualify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct approved V7 payload
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 | base64 --decode > "$RUNNER_TEMP/aurenoeva-v7.tar.xz"
          echo "ded9b1fb9918c1c688e2a253b258f11ce0bdc0cda7d348da2c4c642c95e7e56d  $RUNNER_TEMP/aurenoeva-v7.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/aurenoeva-v7.tar.xz" -C "$RUNNER_TEMP/source"

      - name: Apply V7.1 production hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat hotfix/v7.1/site.css >> "$RUNNER_TEMP/source/site/assets/css/site.css"
          cp hotfix/v7.1/_form_common.php "$RUNNER_TEMP/source/site/_form_common.php"
          cp hotfix/v7.1/contact-submit.php "$RUNNER_TEMP/source/site/contact-submit.php"

      - name: Apply V7.2 logo lockup hotfix
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/v7.2/site.js "$RUNNER_TEMP/source/site/assets/js/site.js"
          cat hotfix/v7.2/site.css >> "$RUNNER_TEMP/source/site/assets/css/site.css"
          base64 --decode hotfix/v7.2/aurenoeva-logo-approved.b64 > "$RUNNER_TEMP/source/site/assets/img/brand/aurenoeva-logo-approved.png"

      - name: Apply V7.3 search-to-transaction journey
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/v7.3/site.js "$RUNNER_TEMP/source/site/assets/js/site.js"
          cat hotfix/v7.3/site.css >> "$RUNNER_TEMP/source/site/assets/css/site.css"
          cp hotfix/v7.3/index.html "$RUNNER_TEMP/source/site/index.html"
          cp hotfix/v7.3/how-it-works.html "$RUNNER_TEMP/source/site/how-it-works.html"
          cp hotfix/v7.3/requirement.html "$RUNNER_TEMP/source/site/requirement.html"
          cp hotfix/v7.3/catalogue-search.php "$RUNNER_TEMP/source/site/catalogue-search.php"
          cp hotfix/v7.3/requirement-submit.php "$RUNNER_TEMP/source/site/requirement-submit.php"
          cp hotfix/v7.3/privacy.html "$RUNNER_TEMP/source/site/privacy.html"
          cp hotfix/v7.3/cookies.html "$RUNNER_TEMP/source/site/cookies.html"

      - name: Apply V7.4 live CORE binding adapter
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/v7.4/_core_bridge.php "$RUNNER_TEMP/source/site/_core_bridge.php"
          cp hotfix/v7.4/core-health.php "$RUNNER_TEMP/source/site/core-health.php"
          cp hotfix/v7.4/catalogue-search.php "$RUNNER_TEMP/source/site/catalogue-search.php"
          cp hotfix/v7.4/requirement-submit.php "$RUNNER_TEMP/source/site/requirement-submit.php"
          cp hotfix/v7.4/site.js "$RUNNER_TEMP/source/site/assets/js/site.js"
          while IFS= read -r -d '' f; do
            sed -i 's#assets/js/site.js\([?][^"]*\)\?#assets/js/site.js?v=7.4.1#g' "$f"
            sed -i 's#assets/css/site.css\([?][^"]*\)\?#assets/css/site.css?v=7.4.1#g' "$f"
          done < <(find "$RUNNER_TEMP/source/site" -maxdepth 1 -type f -name '*.html' -print0)

      - name: Apply V8.2.6.1 locked checkpoint
        shell: bash
        run: |
          set -euo pipefail

          cp hotfix/v8.2.6.1/index.html "$RUNNER_TEMP/source/site/index.html"
          cmp --silent hotfix/v8.2.6.1/index.html "$RUNNER_TEMP/source/site/index.html"

          mkdir -p "$RUNNER_TEMP/source/site/assets/img/v826"

          # Freeze the corrected 350x375 hero engine visual explicitly.
          base64 --decode hotfix/v8.2.6/hero-spare-parts.b64 > "$RUNNER_TEMP/source/site/assets/img/hero-spare-parts.webp"
          echo "6b5a9889271a08dc881dff28347cc351e21422661a437e75003c0c56aaebad0e  $RUNNER_TEMP/source/site/assets/img/hero-spare-parts.webp" | sha256sum -c -

          base64 --decode hotfix/v8.2.6-final/assets/sector-lab.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-lab.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-test.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-test.webp"
          cat hotfix/v8.2.6-final/assets/sector-medical.correct.b64.* | base64 --decode > "$RUNNER_TEMP/source/site/assets/img/v826/sector-medical.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-industrial.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-industrial.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-energy.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-energy.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-marine.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-marine.webp"
          base64 --decode hotfix/v8.2.6-final/assets/sector-aviation.webp.b64 > "$RUNNER_TEMP/source/site/assets/img/v826/sector-aviation.webp"
          cat hotfix/v8.2.6-final/assets/procurement-bg.b64.* | base64 --decode > "$RUNNER_TEMP/source/site/assets/img/v826/procurement-bg.webp"

          echo "fcb36d331c90cc0113c1cbb1f690ceaa731e41ef7ac31fb1931990f4b52cadcf  $RUNNER_TEMP/source/site/assets/img/v826/sector-lab.webp" | sha256sum -c -
          echo "3b3835eaae062a1ee92761ae90882123851545ea1c888421750332abcefb8b90  $RUNNER_TEMP/source/site/assets/img/v826/sector-test.webp" | sha256sum -c -
          echo "d8755a2862944340b153809cbc7910b754013fc159e03e496f964dc1f428878b  $RUNNER_TEMP/source/site/assets/img/v826/sector-medical.webp" | sha256sum -c -
          echo "cb8744e4780fce0ad3ca4ecd7ec6064b65ed7fef19f2d405847c3f0cdd25aba5  $RUNNER_TEMP/source/site/assets/img/v826/sector-industrial.webp" | sha256sum -c -
          echo "e3e5bdbfe24d6d60f9d6626a728ba4f6d89f78b15f10885c4825c172cb3b824a  $RUNNER_TEMP/source/site/assets/img/v826/sector-energy.webp" | sha256sum -c -
          echo "40077a0fbad52215c0ca0bed48cd8528a8afc8e43d80aba2ce1069ab31c0a8f2  $RUNNER_TEMP/source/site/assets/img/v826/sector-marine.webp" | sha256sum -c -
          echo "8e0c7524f71c83c4a7d29609abf4ba4443c29151f72debff3e0edb247ef0faa9  $RUNNER_TEMP/source/site/assets/img/v826/sector-aviation.webp" | sha256sum -c -
          echo "5543c2341d44dd43f00ecaa5933f8375ab13c84b9bd8ab34171e7db4c20e085a  $RUNNER_TEMP/source/site/assets/img/v826/procurement-bg.webp" | sha256sum -c -

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find "$RUNNER_TEMP/source/site" -type f -name '*.js' -print0)

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find "$RUNNER_TEMP/source/site" -type f -name '*.php' -print0)

      - name: Qualify V7.4 CORE bridge contract
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18741 hotfix/v7.4/tests/mock_core_router.php >"$RUNNER_TEMP/aur-core-mock.log" 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if php -r 'exit(@file_get_contents("http://127.0.0.1:18741/api/health")===false?1:0);'; then break; fi
            sleep 0.25
          done
          php hotfix/v7.4/tests/core_bridge_test.php
          kill "$MOCK_PID" 2>/dev/null || true
          trap - EXIT

      - name: Qualify V8.2.6.1 locked checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PAGE="$RUNNER_TEMP/source/site/index.html"

          test -s "$PAGE"
          grep -q 'AURENOEVA V8.2.6.1' "$PAGE"
          grep -q 'hero-procurement-card' "$PAGE"
          grep -q 'id="procurement"' "$PAGE"
          grep -q 'id="journey"' "$PAGE"
          grep -q 'id="sectors"' "$PAGE"
          grep -q 'class="lens"' "$PAGE"
          grep -q 'id="decision"' "$PAGE"
          grep -q 'data-lang="en"' "$PAGE"
          grep -q 'data-lang="de"' "$PAGE"
          grep -q 'assets/img/hero-spare-parts.webp' "$PAGE"
          grep -q 'assets/img/v826/procurement-bg.webp' "$PAGE"

          for a in sector-lab sector-test sector-medical sector-industrial sector-energy sector-marine sector-aviation; do
            grep -q "assets/img/v826/${a}.webp" "$PAGE"
            test -s "$RUNNER_TEMP/source/site/assets/img/v826/${a}.webp"
          done
          test -s "$RUNNER_TEMP/source/site/assets/img/v826/procurement-bg.webp"
          test -s "$RUNNER_TEMP/source/site/assets/img/brand/aurenoeva-logo-approved.png"
          test -s "$RUNNER_TEMP/source/site/assets/img/hero-spare-parts.webp"

          ! grep -q 'FINAL CHECKPOINT · NOT LIVE' "$PAGE"
          ! grep -q 'not deployed' "$PAGE"
          ! grep -q 'nicht deployt' "$PAGE"
          ! grep -q 'v8.2.7' "$PAGE"
          ! grep -q 'V8.2.7' "$PAGE"

          # Visual-authority geometry: these are the only approved V8.2.5 -> V8.2.6 hero deltas.
          grep -q 'grid-template-columns:minmax(0,1fr) 285px;gap:20px' "$PAGE"
          grep -q 'align-content:center;justify-items:end;gap:10px' "$PAGE"
          grep -q 'max-width:285px;height:auto' "$PAGE"

          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' "$PAGE"
          grep -q 'industries.html#laboratory' "$PAGE"
          grep -q 'requirement.html?' "$PAGE"
          grep -q 'V8.2.6.1 interaction restoration' "$PAGE"

          echo "V8.2.6.1 locked checkpoint qualification: PASS"

      - name: Build clean production branch
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY="$RUNNER_TEMP/aurenoeva-production"
          rm -rf "$DEPLOY"
          mkdir -p "$DEPLOY"
          cp -a "$RUNNER_TEMP/source/site/." "$DEPLOY/"
          printf '%s\n' "Aurenoeva V8.2.6.1 production ${GITHUB_SHA}" > "$DEPLOY/VERSION.txt"
          cd "$DEPLOY"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "Aurenoeva production deploy ${GITHUB_SHA}"
          git branch -M production
          git push --force origin production
