          from pathlib import Path
          import os,sys
          site=Path(sys.argv[1])
          script=site/'assets/js/site.js'
          js=script.read_text(encoding='utf-8')
          anchor=" function showMatchStatus(message,kind='neutral'){"
          assert js.count(anchor)==1, "wizard selection integration changed"
          handler="""  document.addEventListener('aur:add-catalogue-part', event=>{
             const part=event.detail?.part;
             if(!part || !part.canonical_id)return;
             selectedParts=addSelectedPart(selectedParts,part);
             renderSelected();
             if(step>=3)renderBrief(step===4);
           });
          """
          js=js.replace(anchor,handler+anchor,1)
          # The browsing scope must match the category saved in the enquiry.
          cat_anchor="fields.category.innerHTML=industries[fields.industry.value].map("
          assert js.count(cat_anchor)==1
          js=js.replace(cat_anchor,
              "fields.category.innerHTML="+chr(96)+"<option value=''>${lang==='de'?'Alle Kategorien':'All categories'}</option>"+chr(96)+"+industries[fields.industry.value].map(",1)
          label_anchor="function categoryLabel(industry,value,lang){"
          assert js.count(label_anchor)==1
          js=js.replace(label_anchor,label_anchor+
              "if(!value)return lang==='de'?'Alle Kategorien':'All categories';",1)
          script.write_text(js,encoding='utf-8')
          page=site/'requirement.html'
          html=page.read_text(encoding='utf-8')
          assert html.count('</head>')==1 and html.count('</body>')==1
          assert 'catalogue-browser.js' not in html
          release=os.environ['GITHUB_SHA'][:12]
          html=html.replace('</head>',f'<link rel="stylesheet" href="assets/css/catalogue-browser.css?v={release}"></head>',1)
          html=html.replace('</body>',f'<script defer src="assets/js/catalogue-browser.js?v={release}"></script><script defer src="assets/js/catalogue-translation.js?v={release}"></script></body>',1)
          page.write_text(html,encoding='utf-8')
          # Use a release-specific URL for the homepage → sourcing transition.
          # This avoids reopening a previously cached HTML page with obsolete JS.
          home=site/'index.html'
          homepage=home.read_text(encoding='utf-8')
          route='return "requirement.html?"+p.toString();'
          assert homepage.count(route)==1, "homepage requirement route changed"
          homepage=homepage.replace(route, f'p.set("rev","{release}");'+route,1)
          home.write_text(homepage,encoding='utf-8')
          PY
          php hotfix/catalogue-browser/tests/catalogue_browser_test.php
          php -l "$RUNNER_TEMP/source/site/catalogue-browse.php"
