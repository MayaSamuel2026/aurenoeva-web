              $yMax = max(14, (int)ceil($h * 0.12));
              for ($y=0; $y <= $yMax; $y += max(1, (int)floor($yMax/6))) {
                  for ($x=0; $x <= $xMax; $x += max(1, (int)floor($xMax/6))) {
                      $rgb = imagecolorat($im, min($x,$w-1), min($y,$h-1));
                      $r = ($rgb >> 16) & 0xFF; $g = ($rgb >> 8) & 0xFF; $b = $rgb & 0xFF;
