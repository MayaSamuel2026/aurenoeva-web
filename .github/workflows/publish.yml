      - name: Build clean production branch
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY="$RUNNER_TEMP/aurenoeva-production"
          rm -rf "$DEPLOY"

          # Keep production history fast-forward so Hostinger Git auto-deploy
          # sees every qualified release as a normal new commit.
          git clone -q --branch production "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DEPLOY"
          cd "$DEPLOY"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/source/site/." "$DEPLOY/"
          printf '%s\n' "Aurenoeva V8.2.6.11 production ${GITHUB_SHA}" > "$DEPLOY/VERSION.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Production payload unchanged; nothing to publish."
          else
            git commit -qm "Aurenoeva production deploy ${GITHUB_SHA}"
            git push origin production
          fi

      - name: Verify exact website release and public catalogue status
        shell: bash
        run: |
          set -euo pipefail
          # Allow Hostinger's independent Git auto-deployment a realistic rollout window.
          # Never report success until the exact website SHA and public catalogue read back.
          for attempt in {1..60}; do
            VERSION=$(curl -fsS --max-time 12 -H 'Cache-Control: no-cache' \
              "https://aurenoeva.com/VERSION.txt?release=${GITHUB_SHA}" || true)
            STATUS=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
              "https://aurenoeva.com/catalogue-count.php?release=${GITHUB_SHA}" || true)
            HEADERS=$(curl --silent --show-error --max-time 12 -D - -o /dev/null \
              -H 'Cache-Control: no-cache' \
              "https://aurenoeva.com/catalogue-sync.php?release=${GITHUB_SHA}" || true)
            if [[ "$VERSION" == *"$GITHUB_SHA" ]] \
              && printf '%s\n' "$HEADERS" | tr -d '\r' | grep -qi '^x-aurenoeva-catalogue-bulk: atomic-snapshot-v1$' \
              && printf '%s' "$STATUS" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("ok") is True and d.get("searchable_parts",0)>0 and d.get("snapshot_updated_at_utc")'; then
              echo "AURENOEVA_EXACT_LIVE_RELEASE_AND_STATUS=PASS"
              exit 0
            fi
            echo "Website commit, PHP receiver or catalogue status not yet verified ($attempt/60)"
            # Hostinger sometimes fails a shallow Git checkout while its own deployment
            # is running. Re-announce the SAME verified payload after the first
            # unsuccessful window; never change website or catalogue data.
            if [[ "$attempt" == 18 || "$attempt" == 39 ]]; then
              git -C "$RUNNER_TEMP/aurenoeva-production" -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --allow-empty -qm "Retry Hostinger checkout for ${GITHUB_SHA:0:12} (#$attempt)"
              git -C "$RUNNER_TEMP/aurenoeva-production" push origin production
              echo "AURENOEVA_HOSTINGER_REDEPLOY_RETRY=$attempt"
            fi
            sleep 5
          done
          echo "::error::GitHub production branch alone is insufficient. Verify live VERSION.txt SHA and PHP code serving catalogue-count.php with snapshot_updated_at_utc."
          exit 1

      - name: Verify live catalogue counts and translation transport
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, urllib.request, urllib.parse
          base = "https://aurenoeva.com/"
          def get(path):
              request = urllib.request.Request(base + path, headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.load(response)
          sectors = ("laboratory","test","medical","industrial","energy","marine","aviation")
          # The crawler may atomically replace its snapshot while the seven
          # independent sector requests are being read. Reconcile only against
          # one unchanged publication epoch; never flag normal growth as loss.
          for scan in range(1,4):
              status = get("catalogue-count.php?acceptance=${GITHUB_SHA}&scan="+str(scan))
              assert status["ok"] is True, status
              breakdown = {}
              for sector in sectors:
                  data = get("catalogue-browse.php?" + urllib.parse.urlencode({
                      "sector":sector,"acceptance":"${GITHUB_SHA}","scan":scan}))
                  assert data["ok"] is True and data["sector"] == sector, data
                  assert sum(c["count"] for c in data["categories"]) == data["sector_total"]
                  breakdown[sector] = data["sector_total"]
              finish = get("catalogue-count.php?acceptance=${GITHUB_SHA}&scan="+str(scan)+"-end")
              print("AURENOEVA_COUNT_DIAGNOSTIC",{"scan":scan,"before":status["searchable_parts"],
                    "after":finish["searchable_parts"],"browsed":sum(breakdown.values()),
                    "snapshot_before":status.get("snapshot_updated_at_utc"),
                    "snapshot_after":finish.get("snapshot_updated_at_utc")},flush=True)
              if status.get("snapshot_updated_at_utc") != finish.get("snapshot_updated_at_utc") or (
                  status["searchable_parts"] != finish["searchable_parts"]):
                  continue
              assert sum(breakdown.values()) == status["searchable_parts"], {
                  "public_counter":status["searchable_parts"],"browsed":sum(breakdown.values())}
              assert status["published_parts"] >= status["searchable_parts"], status
              break
          else:
              raise RuntimeError("catalogue_snapshot_changed_during_every_acceptance_scan")
          furniture = get("catalogue-browse.php?sector=laboratory&q=Tribesigns&acceptance=${GITHUB_SHA}")
          assert furniture["total"] == 0, furniture["total"]
          print("AURENOEVA_LIVE_SEVEN_SECTORS_AND_VISIBLE_COUNT=PASS",breakdown)
          print("AURENOEVA_LIVE_NONTECHNICAL_FURNITURE_EXCLUDED=PASS")
          payload=json.dumps({"text":"La bomba funciona correctamente.","target":"en"}).encode()
          request=urllib.request.Request(base+"catalogue-translate.php",
              data=payload,headers={"Content-Type":"application/json","Accept":"application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  result=json.load(response)
              assert result.get("ok") and result.get("text") and result["text"]!="La bomba funciona correctamente.",result
              print("AURENOEVA_LIVE_SERVER_TRANSLATION=PASS")
          except Exception as exc:
              # The free upstream translator has no uptime SLA; do not turn an
              # otherwise healthy catalogue code release into an outage.
              print("::warning::AURENOEVA_LIVE_SERVER_TRANSLATION=UNAVAILABLE "
                    +type(exc).__name__+": "+str(exc)[:160])
          PY

