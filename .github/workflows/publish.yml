          handler="""  document.addEventListener('aur:add-catalogue-part', event=>{
             const part=event.detail?.part;
             if(!part || !part.canonical_id)return;
             selectedParts=addSelectedPart(selectedParts,part);
             renderSelected();
             if(step>=3)renderBrief(step===4);
             // Report success only when the enquiry contains this exact part.
             event.detail.accepted=selectedParts.some(p=>partKey(p)===partKey(part));
           });
          """
          js=js.replace(anchor,handler+anchor,1)
          tray_anchor="function renderSelected(){renderSelectedPartTray(selectedTray,selectedParts,key=>{selectedParts=removeSelectedPart(selectedParts,key);renderSelected();if(step>=3)renderBrief(step===4)})}"
          assert js.count(tray_anchor)==1, "wizard selection tray changed"
