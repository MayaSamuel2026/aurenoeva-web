name: AURENOEVA private procurement qualification
on:
  push:
    branches: [main]
    paths:
      - 'tools/procurement_*.py'
      - 'tools/catalogue_*.py'
      - 'config/catalogue_sources.json'
      - 'tests/test_catalogue_*.py'
      - 'hotfix/v8.2.6.10/catalogue_local.php'
      - 'hotfix/v8.2.6.11/catalogue-search.php'
      - 'hotfix/v8.2.6.12/catalogue-sync.php'
      - 'hotfix/v8.2.6.11/tests/**'
      - 'hotfix/v8.2.6.12/tests/**'
      - 'ops/upgrade-catalogue-sectors.sh'
      - 'tests/test_procurement_*.py'
      - 'deployment/crm/aurenoeva-v1/import.php'
      - 'deployment/site/procurement/**'
      - 'tests/test_procurement_hostinger_php.php'
      - 'tests/test_procurement_worldwide_php.php'
      - '.github/workflows/publish.yml'
      - 'deployment/install-hostinger.sh'
      - 'deployment/install-hostinger-worker.sh'
      - '.github/workflows/procurement-private-qualification.yml'
permissions:
  contents: read
concurrency:
  group: aurenoeva-private-procurement-main
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and focused case / sanctions / RFQ checks
        run: |
          python3 -m compileall -q tools/procurement_intake.py tools/procurement_rfq.py tools/procurement_inbox.py tools/procurement_case_store.py tools/procurement_sanctions.py tools/procurement_hostinger_worker.py
          python3 -m unittest discover -s tests -p 'test_procurement_*.py' -v
      - name: Catalogue crawler and private SSH publisher regression tests
        run: |
          python3 -m compileall -q tools/catalogue_worker.py tools/catalogue_publish.py
          python3 -m unittest discover -s tests -p 'test_catalogue_*.py' -v
      - name: Configure current PHP with ZIP and XML
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip,xml,simplexml,mbstring
      - name: PHP upload syntax / deployment shell syntax
        run: |
          php -l deployment/crm/aurenoeva-v1/import.php
          php -l deployment/site/procurement/index.php
          php -l deployment/site/procurement/private_cases.php
          php -l deployment/site/procurement/supplier_intelligence.php
          php -l deployment/site/procurement/supplier_discovery.php
          php -l deployment/site/procurement/supplier_routes.php
          php -l deployment/site/procurement/supplier_worldwide.php
          php -l deployment/site/procurement/supplier_rfq.php
          php -l deployment/site/procurement/supplier_portal.php
          php -l deployment/site/procurement/staff_auth.php
          php -l deployment/site/procurement/supplier-refresh-cli.php
          php -l deployment/site/procurement/setup-cli.php
          php -l deployment/site/procurement/activate.php
          php tests/test_procurement_hostinger_php.php
          php tests/test_procurement_worldwide_php.php
          php -l hotfix/v8.2.6.10/catalogue_local.php
          php -l hotfix/v8.2.6.11/catalogue-search.php
          php -l hotfix/v8.2.6.12/catalogue-sync.php
          php hotfix/v8.2.6.11/tests/catalogue_snapshot_test.php
          php hotfix/v8.2.6.12/tests/catalogue_sync_test.php
          bash -n ops/connect-catalogue-search.sh
          bash -n deployment/install-hostinger.sh
          bash -n deployment/install-hostinger-worker.sh
          # Guard against a future release omitting the RFQ/source/search modules.
          for name in supplier_routes.php supplier_worldwide.php supplier_rfq.php supplier_portal.php worldwide.js; do
            grep -q " $name " .github/workflows/publish.yml
          done
          grep -q 'id="aur-worldwide-scan-all"' deployment/site/procurement/index.php
