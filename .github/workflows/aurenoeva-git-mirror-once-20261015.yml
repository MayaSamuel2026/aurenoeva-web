name: Aurenoeva complete Git history backup once
# Temporary one-time archival job; no deploy, customer data, secrets or production changes.
on:
  push:
    branches:
      - backup/aurenoeva-complete-git-history-20261015
    paths:
      - .github/workflows/aurenoeva-git-mirror-once-20261015.yml
permissions:
  contents: read
jobs:
  full-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mirror all existing branch and tag refs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          git clone --quiet --mirror "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/aurenoeva-full-mirror.git"
          test "$(git -C "$RUNNER_TEMP/aurenoeva-full-mirror.git" for-each-ref --format='%(refname)' refs/heads | wc -l)" -ge 16
          mkdir -p "$RUNNER_TEMP/aurenoeva-archive"
          git -C "$RUNNER_TEMP/aurenoeva-full-mirror.git" bundle create "$RUNNER_TEMP/aurenoeva-archive/aurenoeva-full-history-20261015.bundle" --all
          sha256sum "$RUNNER_TEMP/aurenoeva-archive/aurenoeva-full-history-20261015.bundle" > "$RUNNER_TEMP/aurenoeva-archive/SHA256SUMS.txt"
      - name: Validate independently restorable Git history
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --mirror "$RUNNER_TEMP/aurenoeva-archive/aurenoeva-full-history-20261015.bundle" "$RUNNER_TEMP/restored.git"
          git -C "$RUNNER_TEMP/aurenoeva-full-mirror.git" for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | LC_ALL=C sort > "$RUNNER_TEMP/original-refs.txt"
          git -C "$RUNNER_TEMP/restored.git" for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | LC_ALL=C sort > "$RUNNER_TEMP/aurenoeva-archive/RESTORED_REFS.txt"
          diff -u "$RUNNER_TEMP/original-refs.txt" "$RUNNER_TEMP/aurenoeva-archive/RESTORED_REFS.txt"
          git -C "$RUNNER_TEMP/restored.git" fsck --full --no-reflogs
          printf 'RESTORE_VERIFICATION=PASS\nREPOSITORY=%s\nBRANCHES=%s\nTAGS=%s\n' "$GITHUB_REPOSITORY" "$(git -C "$RUNNER_TEMP/restored.git" for-each-ref --format='%(refname)' refs/heads | wc -l)" "$(git -C "$RUNNER_TEMP/restored.git" for-each-ref --format='%(refname)' refs/tags | wc -l)" > "$RUNNER_TEMP/aurenoeva-archive/VERIFY_RESULT.txt"
          cat "$RUNNER_TEMP/aurenoeva-archive/VERIFY_RESULT.txt"
      - name: Provide one downloadable full-history backup
        uses: actions/upload-artifact@v4
        with:
          name: aurenoeva-verified-git-mirror-20261015
          path: ${{ runner.temp }}/aurenoeva-archive/
          retention-days: 30
          if-no-files-found: error
